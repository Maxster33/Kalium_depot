# Didacticiel de Kixster (KS_Didacticiel) : contenu du bouton « Didacticiel » du comparateur « Informations ».
#
# Mise à jour : modifier ce fichier dans le dépôt (KS_Didacticiel/src/main/resources/didacticiel.yml), l'envoyer
# tel quel dans plugins/KS_Didacticiel/ sur Kixster (jamais dans l'éditeur de WinSCP : les accents y sont abîmés),
# puis taper /didacticiel recharger. Ni recompilation ni redémarrage.
#
# Structure : themes > <id du thème> > nom, icone, resume, requiert (facultatif), nouveautes > <id de la nouveauté> >
# nom, icone, texte, commande (facultatif), recettes (facultatif), requiert (facultatif), nouveau.
# - Les ids (sans point ni espace) servent à retenir ce que chaque joueur a lu : ne pas les changer sans raison.
# - icone : nom d'un objet du jeu (EMERALD, OAK_BOAT...). Inconnu : un livre, et un avertissement dans la console.
# - texte : une seule ligne ici ; le plugin le coupe tout seul en lignes d'environ 35 caractères.
# - Ton (LeKiwi06, 18/10/2026) : rester évasif sur ce qui est à découvrir (butin, coffres...) : dire qu'il y a du
#   changement, pas le détail.
# - recettes : liste de clés de recettes du serveur ("ks_crafts:red_sand") ; une clé finie par * prend toutes celles
#   qui commencent ainsi. La nouveauté devient cliquable et montre ces recettes, une par page.
# - requiert : un plugin ("KS_Trains") ou un plugin et sa version minimale ("KS_Decapitator 1.3.0") : sans lui, le
#   thème ou la nouveauté n'est pas montré (utile pour préparer une nouveauté avant son plugin).
# - nouveau : toujours ENTRE GUILLEMETS. La nouveauté porte « Nouveau » pour chaque joueur qui n'a pas encore ouvert
#   son thème depuis que cette valeur a changé. Mettre la date du jour sur une nouveauté ajoutée ou modifiée ;
#   laisser l'ancienne valeur pour une simple correction de texte ; "" = jamais « Nouveau ». Un deuxième changement le
#   même jour : ajouter une lettre ("2026-10-18b").
# - 45 thèmes au plus, 45 nouveautés au plus par thème.

titre: "Didacticiel de Kixster"

themes:

  monde:
    nom: "Le monde"
    icone: GRASS_BLOCK
    resume: "Un monde tout neuf en 26.3."
    nouveautes:
      reliefs:
        nom: "Nouveaux reliefs"
        icone: MOSS_BLOCK
        texte: "Montagnes de Tectonic et 11 biomes de Terralith (falaises, volcans, taïga...). Les villages et les structures vanilla sont bien là."
        nouveau: "2026-10-18"
      carte:
        nom: "Une carte de 40 000 blocs"
        icone: FILLED_MAP
        texte: "Le monde va de -20 000 à +20 000 en X et en Z. Il est déjà entièrement généré."
        nouveau: "2026-10-18"
      dimensions:
        nom: "Nether et End fermés"
        icone: OBSIDIAN
        texte: "Les portails du Nether et de l'End ne mènent nulle part pour l'instant."
        nouveau: "2026-10-18"
      sommeil:
        nom: "Passer la nuit"
        icone: WHITE_BED
        texte: "Il suffit que 25 % des joueurs connectés dorment pour passer la nuit."
        nouveau: "2026-10-18"

  butin:
    nom: "Le butin"
    icone: RAW_GOLD
    resume: "Blocs, mobs et coffres ne donnent plus tout à fait la même chose."
    nouveautes:
      minerais:
        nom: "Minerais"
        icone: IRON_ORE
        texte: "Le fer et l'or sont plus généreux, et les autres minerais réservent parfois une surprise."
        nouveau: "2026-10-18"
      emeraude:
        nom: "Émeraude de deepslate"
        icone: DEEPSLATE_EMERALD_ORE
        texte: "Le plus rare des minerais cache quelque chose en plus."
        nouveau: "2026-10-18"
      feuilles:
        nom: "Feuilles"
        icone: OAK_LEAVES
        texte: "Toutes les feuilles peuvent donner des pommes, et certaines bien plus précieuses. Quelques arbres sont aussi plus généreux en pousses."
        nouveau: "2026-10-18"
      fermes:
        nom: "Fermes à mobs"
        icone: IRON_NUGGET
        texte: "Les fermes automatiques rapportent moins qu'avant : la chasse à la main est mieux récompensée."
        nouveau: "2026-10-18"
      potions:
        nom: "Potions"
        icone: POTION
        texte: "La verrue du Nether ne se brasse plus : les potions se trouvent sur les mobs et dans les récompenses. À toi de découvrir qui lâche quoi."
        nouveau: "2026-10-18"
      rares:
        nom: "Butin rare"
        icone: ECHO_SHARD
        texte: "Certains mobs cachent un butin inattendu. Le crâne de wither squelette, lui, ne tombe plus tel quel."
        nouveau: "2026-10-18"
      coffres:
        nom: "Coffres de structures"
        icone: CHEST
        texte: "Le butin des coffres de structures a été revu : de belles trouvailles attendent les explorateurs."
        nouveau: "2026-10-18"
      peche:
        nom: "Pêche"
        icone: FISHING_ROD
        texte: "Plus de livres enchantés à la pêche : d'autres trésors à la place."
        nouveau: "2026-10-18"
      tetes:
        nom: "Têtes de mobs"
        icone: ZOMBIE_HEAD
        texte: "Un mob tué par un joueur a une petite chance de donner sa tête. /tetes montre ta collection."
        commande: "/tetes"
        nouveau: "2026-10-18c"
      tetes-joueurs:
        nom: "Têtes de joueurs"
        icone: PLAYER_HEAD
        texte: "Chaque joueur a son mob secret : renomme ce mob avec son pseudo, tue-le, et tu obtiens la tête du joueur. À toi de deviner quel mob !"
        requiert: "KS_Decapitator 1.3.0"
        nouveau: "2026-10-18c"
      shulkers:
        nom: "Shulkers de couleur"
        icone: SHULKER_SHELL
        texte: "Clic droit avec un colorant sur un shulker : il prend cette couleur."
        requiert: "KS_Decapitator 1.3.0"
        nouveau: "2026-10-18c"

  crafts:
    nom: "Crafts et objets"
    icone: CRAFTING_TABLE
    resume: "Nouvelles recettes et nouveaux objets."
    nouveautes:
      pratiques:
        nom: "Crafts pratiques"
        icone: RED_SAND
        texte: "Sable rouge, sable à partir du grès, blocs bruts, calcite, obsidienne pleureuse, deepslate renforcée, graines, coraux, lumière, cadre invisible, froglights."
        recettes:
          - "ks_crafts:red_sand"
          - "ks_crafts:sand_from_sandstone"
          - "ks_crafts:red_sand_from_red_sandstone"
          - "ks_crafts:raw_iron_block"
          - "ks_crafts:raw_gold_block"
          - "ks_crafts:raw_copper_block"
          - "ks_crafts:calcite"
          - "ks_crafts:crying_obsidian"
          - "ks_crafts:reinforced_deepslate"
          - "ks_crafts:pitcher_pod"
          - "ks_crafts:torchflower_seeds"
          - "ks_crafts:tube_coral_block"
          - "ks_crafts:brain_coral_block"
          - "ks_crafts:bubble_coral_block"
          - "ks_crafts:fire_coral_block"
          - "ks_crafts:horn_coral_block"
          - "ks_crafts:light_15"
          - "ks_crafts:invisible_item_frame"
          - "ks_crafts:verdant_froglight"
          - "ks_crafts:ochre_froglight"
          - "ks_crafts:pearlescent_froglight"
        nouveau: "2026-10-18c"
      livre:
        nom: "Livre de recettes"
        icone: KNOWLEDGE_BOOK
        texte: "Chaque recette du serveur apparaît dans ton livre de recettes dès que tu obtiens un de ses ingrédients."
        nouveau: "2026-10-18"
      shulker:
        nom: "Boîte de shulker"
        icone: SHULKER_BOX
        texte: "Elle se fabrique avec un coffre de l'Ender entre les deux carapaces, au lieu d'un coffre."
        recettes:
          - "ks_crafts:shulker_box"
        nouveau: "2026-10-18"
      armure:
        nom: "Armure fondue"
        icone: IRON_CHESTPLATE
        texte: "Un casque, un plastron, des jambières ou des bottes en fer, or, cuivre ou cotte de mailles fondus au four donnent 1 lingot."
        recettes:
          - "ks_crafts:*_armure"
        nouveau: "2026-10-18"
      spawners:
        nom: "Spawners"
        icone: SPAWNER
        texte: "Les spawners naturels donnent des Fragments de Spawner. 7 fragments, un Cœur de Spawner et une tête de mob font un spawner de ce mob, qui se récupère quand on le casse."
        recettes:
          - "ks_crafts:spawner_*"
        nouveau: "2026-10-18"
      biome:
        nom: "Changeur de Biome"
        icone: END_CRYSTAL
        texte: "Change le biome autour de toi (32 blocs) dans le monde normal, hors des zones protégées et des claims des autres."
        recettes:
          - "ks_crafts:changeur_biome"
        nouveau: "2026-10-18"
      bedrock:
        nom: "Bedrock Breaker"
        icone: BLAZE_ROD
        texte: "Clic droit sur un bloc de bedrock : il disparaît. Usage unique."
        recettes:
          - "ks_crafts:bedrock_breaker"
        nouveau: "2026-10-18"
      cle:
        nom: "Clé de l'End"
        icone: OMINOUS_TRIAL_KEY
        texte: "Ton coffre de l'Ender a 6 rangées : chaque Clé de l'End débloque une case des 3 rangées du bas."
        recettes:
          - "ks_crafts:cle_de_l_end"
        nouveau: "2026-10-18"
      wither:
        nom: "Tête de wither squelette"
        icone: WITHER_SKELETON_SKULL
        texte: "Elle tombe sale, endommagée et désactivée : répare-la par trois crafts pour pouvoir invoquer le Wither."
        recettes:
          - "ks_crafts:tete_wither_*"
          - "ks_crafts:bloc_charbon_de_bois"
          - "ks_crafts:charbon_de_bois_du_bloc"
        nouveau: "2026-10-18"
      elixirs:
        nom: "Élixirs"
        icone: HONEY_BOTTLE
        texte: "8 potions longues autour d'un ingrédient rare donnent un élixir de 10 à 60 minutes (vision nocturne, force, vitesse, chance...)."
        recettes:
          - "ks_elixir:*"
        nouveau: "2026-10-18"

  enclume:
    nom: "Enclume, meule, expérience"
    icone: ANVIL
    resume: "Réparer, stocker son expérience, purifier."
    nouveautes:
      sans-limite:
        nom: "Plus de « Trop cher ! »"
        icone: ANVIL
        texte: "L'enclume répare et fusionne sans limite de prix. Au-delà de 50 niveaux, le coût est réduit de moitié."
        nouveau: "2026-10-18"
      cout:
        nom: "Coût de réparation"
        icone: IRON_SWORD
        texte: "La description de chaque équipement indique combien de niveaux coûte sa réparation complète."
        nouveau: "2026-10-18"
      fioles:
        nom: "Fioles d'expérience"
        icone: EXPERIENCE_BOTTLE
        texte: "Accroupi + clic droit sur une enclume, fiole vide en main : choisis combien de niveaux stocker. Lance la fiole pour les récupérer."
        nouveau: "2026-10-18"
      meule:
        nom: "Retirer une malédiction"
        icone: GRINDSTONE
        texte: "Accroupi, main vide, clic droit sur une meule, puis choisis un objet maudit. Chaque malédiction coûte 1 Cristal de purification (coffres de récompense)."
        nouveau: "2026-10-18"

  economie:
    nom: "Économie"
    icone: EMERALD
    resume: "L'émeraude devient la monnaie."
    nouveautes:
      score:
        nom: "Ton score"
        icone: EMERALD
        texte: "1 émeraude = 1 point. Dépose et retire tes émeraudes dans /economie. Ton solde s'affiche dans la liste Tab ; masqué, il perd 1 % par jour."
        commande: "/economie"
        nouveau: "2026-10-18"
      blocs:
        nom: "Blocs compressés"
        icone: EMERALD_BLOCK
        texte: "Retire de grosses sommes en blocs d'émeraude compressés (tiers 1 à 6), qu'on ne peut ni poser ni décrafter."
        nouveau: "2026-10-18"
      magasin:
        nom: "Ton magasin"
        icone: OAK_SIGN
        texte: "Dans la zone du spawn, crée ton magasin dans un de tes claims (450 points), puis agrandis-le jusqu'à 20 boutiques. Une boutique = un panneau posé sur un coffre. Les autres achètent même à distance."
        commande: "/magasin"
        nouveau: "2026-10-18"
      catalogue:
        nom: "Catalogue des magasins"
        icone: OAK_HANGING_SIGN
        texte: "Tous les magasins des autres joueurs, classés par ventes, avec recherche et favoris. Le lingot d'or en bas ouvre les rachats de la semaine."
        commande: "/magasins (ou /shop, /market)"
        nouveau: "2026-10-18b"
      rachats:
        nom: "Rachats de la semaine"
        icone: HOPPER
        texte: "Chaque lundi, 10 objets que le serveur t'achète en points. Après 2 500 points gagnés ainsi, un quota par objet et par jour s'applique."
        commande: "/rachat"
        nouveau: "2026-10-18"
      echange:
        nom: "Échanges"
        icone: PLAYER_HEAD
        texte: "Propose un échange à un joueur à 5 blocs au plus ; il répond avec /accepter. Objets et points sur un même panneau, validé par les deux."
        commande: "/echange <joueur>"
        nouveau: "2026-10-18"
      marchand:
        nom: "Marchand ambulant"
        icone: WANDERING_TRADER_SPAWN_EGG
        texte: "Les villageois n'ont plus d'échanges. Le marchand ambulant, lui, rachète 10 lots en points, en stock limité."
        nouveau: "2026-10-18"

  claims:
    nom: "Claims"
    icone: GOLDEN_SHOVEL
    resume: "Protéger son terrain."
    nouveautes:
      creer:
        nom: "Créer un claim"
        icone: GRASS_BLOCK
        texte: "/claim protège le chunk où tu te trouves, sur toute la hauteur. Les 10 premiers sont gratuits, puis le prix monte (237 points pour le 11e). 100 au plus."
        commande: "/claim"
        nouveau: "2026-10-18b"
      gerer:
        nom: "Gérer tes claims"
        icone: WRITABLE_BOOK
        texte: "Nom, description, réglages des membres et des visiteurs, expulser un joueur."
        commande: "/claims"
        nouveau: "2026-10-18b"
      membres:
        nom: "Membres et groupes"
        icone: PLAYER_HEAD
        texte: "Jusqu'à 5 membres par claim. Un groupe applique les mêmes membres et réglages à plusieurs claims."
        nouveau: "2026-10-18"
      vente:
        nom: "Vendre un claim"
        icone: GOLD_INGOT
        texte: "Mets-le en vente ; l'acheteur se tient dedans et fait /claim. Supprimer un claim rembourse le dernier prix payé."
        nouveau: "2026-10-18"
      gratuits:
        nom: "Claims gratuits en plus"
        icone: GOLDEN_SHOVEL
        texte: "Un jeton de claim, utilisé depuis /claims, donne un claim gratuit de plus sans faire monter les prix. Le claim de ta maison au spawn ne compte pas non plus."
        nouveau: "2026-10-18"

  deplacements:
    nom: "Se déplacer"
    icone: COMPASS
    resume: "Maison, téléportations, vol, jetons."
    nouveautes:
      maison:
        nom: "Ta maison au spawn"
        icone: LODESTONE
        texte: "/maison create dans un de tes claims de la zone du spawn (500 points) : /spawn t'y ramène. Pour la déplacer : /setspawn, une boussole liée à une magnétite en main."
        commande: "/maison create"
        nouveau: "2026-10-18"
      home:
        nom: "Téléportations"
        icone: ENDER_PEARL
        texte: "Vers ton lit (/bed), ta maison ou tes emplacements. Une gratuite par heure, puis un jeton ou 20 points. Reste 5 secondes sans bouger."
        commande: "/home"
        nouveau: "2026-10-18b"
      localisation:
        nom: "Jeton de localisation"
        icone: COMPASS
        texte: "Une boussole liée à une magnétite entourée de 8 blocs de cuivre ciré. Pose-le dans une case de tes localisations (/jetons) : la magnétite devient une destination de /home. Repris, il t'est rendu et la case attend 24 h. Le badge de localisation donne les cases."
        recettes:
          - "ks_teleport:jeton_localisation"
        nouveau: "2026-10-18b"
      fly:
        nom: "Voler chez soi"
        icone: FEATHER
        texte: "Vole dans tes claims : un jeton donne 10 minutes, un badge une réserve qui se recharge chaque heure. Hors de tes claims, le vol s'arrête."
        commande: "/fly"
        nouveau: "2026-10-18"
      jetons:
        nom: "Jetons et badges"
        icone: NETHERITE_INGOT
        texte: "Un seul coffre : une case par badge, une case par jeton (autant que tu veux) et tes cases de localisation. Maj + clic sur un jeton ou un badge de ton inventaire pour le ranger. Deux badges identiques fusionnent à l'enclume."
        commande: "/jetons (ou /jeton, /badges, /badge)"
        nouveau: "2026-10-18b"

  recompenses:
    nom: "Mort et récompenses"
    icone: ENDER_CHEST
    resume: "Rien ne se perd, tout s'ouvre."
    nouveautes:
      coffre-mort:
        nom: "Coffre de mort"
        icone: CHEST
        texte: "À ta mort, tes objets vont dans un coffre que toi seul peux ouvrir pendant 1 heure, avec la moitié de ton expérience en fiole."
        nouveau: "2026-10-18"
      claim-autre:
        nom: "Mort chez un autre"
        icone: IRON_DOOR
        texte: "Si tu meurs dans le claim d'un autre joueur, tes objets t'attendent directement dans /rewards."
        nouveau: "2026-10-18"
      coffres:
        nom: "Tes coffres de mort"
        icone: RECOVERY_COMPASS
        texte: "Leur position et le temps restant. Un jeton ou un badge de la mort les récupère à distance."
        commande: "/coffres"
        nouveau: "2026-10-18"
      rewards:
        nom: "Récompenses"
        icone: ENDER_CHEST
        texte: "Les gains des mini-jeux et de Kanvas arrivent ici, en coffres « Non ouvert » avec leur valeur moyenne. Clic droit, coffre en main, pour l'ouvrir."
        commande: "/rewards"
        nouveau: "2026-10-18"
      fusion:
        nom: "Fusion de coffres"
        icone: ANVIL
        texte: "Clic droit sur une enclume, coffre de récompense en main : fusionne deux coffres en un plus gros, contre des points d'expérience."
        nouveau: "2026-10-18"

  vehicules:
    nom: "Véhicules"
    icone: OAK_BOAT
    resume: "Bateaux en musique, trains, véhicules protégés."
    nouveautes:
      jukebox:
        nom: "Bateau à jukebox"
        icone: JUKEBOX
        texte: "Bateau + jukebox. Accroupi + clic droit (à bord : touche de saut) pour choisir un disque de ton inventaire ; la musique suit le bateau."
        recettes:
          - "ks_crafts:bateau_jukebox_*"
        nouveau: "2026-10-18"
      jukebox-coffre:
        nom: "Bateau à coffre et jukebox"
        icone: OAK_CHEST_BOAT
        texte: "Bateau à coffre + jukebox. Il lit en boucle les disques de son coffre ; clic droit : lecture ou pause. Tire-le derrière toi avec une laisse."
        recettes:
          - "ks_crafts:bateau_coffre_jukebox_*"
        nouveau: "2026-10-18"
      laisse:
        nom: "Laisse courte"
        icone: LEAD
        texte: "Un bateau tiré en laisse par un autre bateau le suit à 3 blocs, comme une remorque : il prend les virages derrière lui."
        requiert: "KS_LaisseBateau"
        nouveau: "2026-10-18d"
      verrou:
        nom: "Verrou de véhicule"
        icone: TRIPWIRE_HOOK
        texte: "Crochet + 4 lingots de fer. Clic droit sur un bateau ou wagonnet à coffre, un âne, une mule ou un lama : tant qu'il n'est pas vide, personne d'autre ne l'ouvre, ne le casse ni ne le déplace."
        recettes:
          - "ks_crafts:verrou_vehicule"
        nouveau: "2026-10-18"
      partout:
        nom: "Bateaux et wagonnets"
        icone: MINECART
        texte: "Ils se posent partout, même dans les zones protégées et les claims. Ceux sans coffre se cassent partout."
        nouveau: "2026-10-18"
      locomotive:
        nom: "Train : la locomotive"
        icone: FURNACE_MINECART
        texte: "3 wagonnets à four en ligne à l'établi. Pose-la sur 4 rails droits, dans le sens de ton regard : elle tracte 15 wagons, et 10 de plus par wagonnet à four ajouté."
        requiert: "KS_Trains"
        recettes:
          - "ks_crafts:locomotive"
        nouveau: "2026-10-18c"
      attelage:
        nom: "Train : atteler"
        icone: IRON_CHAIN
        texte: "Chaîne en main, clic droit sur un wagon puis sur un autre, à l'arrêt sur les rails : ils s'attellent. Cisailles : dételer. 64 wagons au plus."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      menu-train:
        nom: "Train : le menu"
        icone: COMPARATOR
        texte: "Accroupi + clic droit sur un four de la locomotive ou sur le wagon contrôleur : la liste des wagons, marche / arrêt, vitesse, dételage, réglages des coffres. Chaque wagon peut y être renommé, et son contenu ouvert depuis le menu."
        requiert: "KS_Trains"
        nouveau: "2026-10-18d"
      controleur:
        nom: "Train : wagon contrôleur"
        icone: REDSTONE_LAMP
        texte: "Un wagonnet entouré, en casque, d'un comparateur, d'un capteur sculk calibré, d'une lampe à redstone, d'un bloc musical et d'un levier. Monte dedans : avancer = vitesse +1 (4 niveaux), reculer = vitesse -1 puis marche arrière, saut = klaxon (un sifflet, ou une corne de chèvre posée dans le contrôleur). Un seul par train, à moins de 5 wagons de la locomotive."
        requiert: "KS_Trains"
        recettes:
          - "ks_crafts:wagon_controleur"
        nouveau: "2026-10-18d"
      carburant:
        nom: "Train : carburant"
        icone: COAL
        texte: "Clic droit sur un four : sa case de carburant (tout combustible). Il brûle selon la distance, la vitesse et la charge : plus le train est long, plus il lui faut de fours."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      wagon-entonnoir:
        nom: "Train : wagon à entonnoir"
        icone: HOPPER_MINECART
        texte: "Il passe les objets des 3 wagons derrière lui vers les 3 wagons devant lui, et remplit les fours de carburant."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      wagon-coffre:
        nom: "Train : wagon à coffre"
        icone: CHEST_MINECART
        texte: "Dans le menu du train, choisis si les entonnoirs du train peuvent y déposer ou y prendre des objets."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      wagon-jukebox:
        nom: "Train : wagon jukebox"
