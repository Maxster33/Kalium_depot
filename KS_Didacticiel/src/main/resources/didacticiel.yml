# Didacticiel de Kixster (KS_Didacticiel) : contenu du bouton « Didacticiel » du comparateur « Informations ».
#
# Mise à jour : modifier ce fichier dans le dépôt (KS_Didacticiel/src/main/resources/didacticiel.yml), l'envoyer
# tel quel dans plugins/KS_Didacticiel/ sur Kixster (jamais dans l'éditeur de WinSCP : les accents y sont abîmés),
# puis taper /didacticiel recharger. Ni recompilation ni redémarrage.
#
# Structure : themes > <id du thème> > nom, icone, resume, requiert (facultatif), nouveautes > <id de la nouveauté> >
# nom, icone, texte, commande (facultatif), recettes (facultatif), requiert (facultatif), nouveau.
# - Les ids (sans point ni espace) servent à retenir ce que chaque joueur a lu : ne pas les changer sans raison.
# - icone : nom d'un objet du jeu (EMERALD, OAK_BOAT...). Inconnu : un livre, et un avertissement dans la console.
# - texte : une seule ligne ici ; le plugin le coupe tout seul en lignes d'environ 35 caractères.
# - Ton (LeKiwi06, 18/10/2026) : rester évasif sur ce qui est à découvrir (butin, coffres...) : dire qu'il y a du
#   changement, pas le détail.
# - recettes : liste de clés de recettes du serveur ("ks_crafts:red_sand") ; une clé finie par * prend toutes celles
#   qui commencent ainsi. La nouveauté devient cliquable et montre ces recettes, une par page.
# - requiert : un plugin ("KS_Trains") ou un plugin et sa version minimale ("KS_Decapitator 1.3.0") : sans lui, le
#   thème ou la nouveauté n'est pas montré (utile pour préparer une nouveauté avant son plugin).
# - nouveau : toujours ENTRE GUILLEMETS. La nouveauté porte « Nouveau » pour chaque joueur qui n'a pas encore ouvert
#   son thème depuis que cette valeur a changé. Mettre la date du jour sur une nouveauté ajoutée ou modifiée ;
#   laisser l'ancienne valeur pour une simple correction de texte ; "" = jamais « Nouveau ». Un deuxième changement le
#   même jour : ajouter une lettre ("2026-10-18b").
# - 45 thèmes au plus, 45 nouveautés au plus par thème.

titre: "Didacticiel de Kixster"

themes:

  monde:
    nom: "Le monde"
    icone: GRASS_BLOCK
    resume: "Un monde tout neuf en 26.3."
    nouveautes:
      reliefs:
        nom: "Nouveaux reliefs"
        icone: MOSS_BLOCK
        texte: "Montagnes de Tectonic et 11 biomes de Terralith (falaises, volcans, taïga...). Les villages et les structures vanilla sont bien là."
        nouveau: "2026-10-18"
      carte:
        nom: "Une carte de 40 000 blocs"
        icone: FILLED_MAP
        texte: "Le monde va de -20 000 à +20 000 en X et en Z. Il est déjà entièrement généré."
        nouveau: "2026-10-18"
      dimensions:
        nom: "Nether et End fermés"
        icone: OBSIDIAN
        texte: "Les portails du Nether et de l'End ne mènent nulle part pour l'instant."
        nouveau: "2026-10-18"
      sommeil:
        nom: "Passer la nuit"
        icone: WHITE_BED
        texte: "Il suffit que 25 % des joueurs connectés dorment pour passer la nuit."
        nouveau: "2026-10-18"

  butin:
    nom: "Le butin"
    icone: RAW_GOLD
    resume: "Blocs, mobs et coffres ne donnent plus tout à fait la même chose."
    nouveautes:
      minerais:
        nom: "Minerais"
        icone: IRON_ORE
        texte: "Le fer et l'or sont plus généreux, et les autres minerais réservent parfois une surprise."
        nouveau: "2026-10-18"
      emeraude:
        nom: "Émeraude de deepslate"
        icone: DEEPSLATE_EMERALD_ORE
        texte: "Le plus rare des minerais cache quelque chose en plus."
        nouveau: "2026-10-18"
      feuilles:
        nom: "Feuilles"
        icone: OAK_LEAVES
        texte: "Toutes les feuilles peuvent donner des pommes, et certaines bien plus précieuses. Quelques arbres sont aussi plus généreux en pousses."
        nouveau: "2026-10-18"
      fermes:
        nom: "Fermes à mobs"
        icone: IRON_NUGGET
        texte: "Les fermes automatiques rapportent moins qu'avant : la chasse à la main est mieux récompensée."
        nouveau: "2026-10-18"
      potions:
        nom: "Potions"
        icone: POTION
        texte: "La verrue du Nether ne se brasse plus : les potions se trouvent sur les mobs et dans les récompenses. À toi de découvrir qui lâche quoi."
        nouveau: "2026-10-18"
      rares:
        nom: "Butin rare"
        icone: ECHO_SHARD
        texte: "Certains mobs cachent un butin inattendu. Le crâne de wither squelette, lui, ne tombe plus tel quel."
        nouveau: "2026-10-18"
      estomac:
        nom: "Estomac du gardien"
        icone: BLACK_BUNDLE
        texte: "Le grand gardien lâche parfois son estomac. Clic droit : il s'ouvre comme un coffre et tu prends ce que tu veux. Tant qu'il est « Non ouvert », personne ne sait ce qu'il cache."
        nouveau: "2026-10-26"
      coffres:
        nom: "Coffres de structures"
        icone: CHEST
        texte: "Le butin des coffres de structures a été revu : de belles trouvailles attendent les explorateurs."
        nouveau: "2026-10-18"
      peche:
        nom: "Pêche"
        icone: FISHING_ROD
        texte: "Les livres enchantés sont de retour à la pêche, mais on n'y pêche jamais Raccommodage (ni livre, ni arc, ni canne). Avec de la patience, on remonte aussi des têtes de créatures marines, et parfois des trésors bien plus rares."
        nouveau: "2026-10-26"
      tetes:
        nom: "Têtes de mobs"
        icone: ZOMBIE_HEAD
        texte: "Un mob tué par un joueur a une petite chance de donner sa tête. /tetes montre ta collection."
        commande: "/tetes"
        nouveau: "2026-10-18c"
      tetes-joueurs:
        nom: "Têtes de joueurs"
        icone: PLAYER_HEAD
        texte: "Chaque joueur a son mob secret : renomme ce mob avec son pseudo, tue-le, et tu obtiens la tête du joueur. À toi de deviner quel mob !"
        requiert: "KS_Decapitator 1.3.0"
        nouveau: "2026-10-18c"
      shulkers:
        nom: "Shulkers de couleur"
        icone: SHULKER_SHELL
        texte: "Clic droit avec un colorant sur un shulker : il prend cette couleur."
        requiert: "KS_Decapitator 1.3.0"
        nouveau: "2026-10-18c"

  crafts:
    nom: "Crafts et objets"
    icone: CRAFTING_TABLE
    resume: "Nouvelles recettes et nouveaux objets."
    nouveautes:
      pratiques:
        nom: "Crafts pratiques"
        icone: RED_SAND
        texte: "Sable rouge, sable à partir du grès, blocs bruts, calcite, obsidienne pleureuse, deepslate renforcée, graines, coraux, lumière, cadre invisible, froglights."
        recettes:
          - "ks_crafts:red_sand"
          - "ks_crafts:sand_from_sandstone"
          - "ks_crafts:red_sand_from_red_sandstone"
          - "ks_crafts:raw_iron_block"
          - "ks_crafts:raw_gold_block"
          - "ks_crafts:calcite"
          - "ks_crafts:crying_obsidian"
          - "ks_crafts:reinforced_deepslate"
          - "ks_crafts:pitcher_pod"
          - "ks_crafts:torchflower_seeds"
          - "ks_crafts:tube_coral_block"
          - "ks_crafts:brain_coral_block"
          - "ks_crafts:bubble_coral_block"
          - "ks_crafts:fire_coral_block"
          - "ks_crafts:horn_coral_block"
          - "ks_crafts:light_15"
          - "ks_crafts:invisible_item_frame"
          - "ks_crafts:verdant_froglight"
          - "ks_crafts:ochre_froglight"
          - "ks_crafts:pearlescent_froglight"
        nouveau: "2026-10-18c"
      blocs-os:
        nom: "Blocs d'os"
        icone: BONE_BLOCK
        texte: "9 os donnent directement 3 blocs d'os, sans passer par la poudre d'os."
        recettes:
          - "ks_crafts:bone_block_from_bones"
        requiert: "KS_Crafts 1.20.0"
        nouveau: "2026-10-23"
      livre:
        nom: "Livre de recettes"
        icone: KNOWLEDGE_BOOK
        texte: "Chaque recette du serveur apparaît dans ton livre de recettes dès que tu obtiens un de ses ingrédients."
        nouveau: "2026-10-18"
      shulker:
        nom: "Boîte de shulker"
        icone: SHULKER_BOX
        texte: "Elle se fabrique avec un coffre de l'Ender entre les deux carapaces, au lieu d'un coffre."
        recettes:
          - "ks_crafts:shulker_box"
        nouveau: "2026-10-18"
      armure:
        nom: "Armure fondue"
        icone: IRON_CHESTPLATE
        texte: "Un casque, un plastron, des jambières ou des bottes en fer, or, cuivre ou cotte de mailles fondus au four donnent 1 lingot."
        nouveau: "2026-10-18"
      spawners:
        nom: "Spawners"
        icone: SPAWNER
        texte: "Les spawners naturels donnent des Fragments de Spawner. 7 fragments en forme de jambières, un Cœur de Spawner au centre et une tête de mob juste en dessous font un spawner de ce mob, qui se récupère quand on le casse."
        recettes:
          - "ks_crafts:spawner_*"
        nouveau: "2026-10-26"
      biome:
        nom: "Changeur de Biome"
        icone: END_CRYSTAL
        texte: "Change le biome autour de toi (32 blocs) dans le monde normal, hors des zones protégées et des claims des autres. 10 utilisations, puis il se casse."
        recettes:
          - "ks_crafts:changeur_biome"
        nouveau: "2026-10-25"
      bedrock:
        nom: "Bedrock Breaker"
        icone: BLAZE_ROD
        texte: "Clic droit sur un bloc de bedrock : il disparaît. Usage unique. Ne fonctionne pas sur l'île centrale de l'End."
        recettes:
          - "ks_crafts:bedrock_breaker"
        nouveau: "2026-10-18"
      cle:
        nom: "Clé de l'End"
        icone: OMINOUS_TRIAL_KEY
        texte: "Ton coffre de l'Ender a 6 rangées : chaque Clé de l'End débloque une case des 3 rangées du bas."
        recettes:
          - "ks_crafts:cle_de_l_end"
        nouveau: "2026-10-18"
      wither:
        nom: "Tête de wither squelette"
        icone: WITHER_SKELETON_SKULL
        texte: "Elle tombe sale, endommagée et désactivée : répare-la par trois crafts pour pouvoir invoquer le Wither."
        recettes:
          - "ks_crafts:tete_wither_*"
          - "ks_crafts:bloc_charbon_de_bois"
          - "ks_crafts:charbon_de_bois_du_bloc"
        nouveau: "2026-10-18"
      elixirs:
        nom: "Élixirs"
        icone: HONEY_BOTTLE
        texte: "8 potions longues autour d'un ingrédient rare donnent un élixir de 10 à 60 minutes (vision nocturne, force, vitesse, chance...)."
        recettes:
          - "ks_elixir:*"
        nouveau: "2026-10-18"
      casse_croute:
        nom: "Casse-croûte doré"
        icone: SUSPICIOUS_STEW
        texte: "Pomme d'or, carotte dorée, pissenlit doré, pastèque scintillante, tournesol et bol. Il nourrit bien, se mange même rassasié et donne 4 cœurs d'absorption, Célérité II et Vitesse I pendant 5 minutes."
        recettes:
          - "ks_cassecroute:casse_croute_dore"
        requiert: "KS_CasseCroute"
        nouveau: "2026-10-27"
      coffre_renforce:
        nom: "Coffre renforcé"
        icone: CHEST
        texte: "Stocke jusqu'à 1 000 stacks d'un seul objet. Clic droit pour déposer ou retirer ; les entonnoirs le remplissent et le vident, un comparateur donne son remplissage. Jamais de coffre double, et il ne se casse que vide. Il ne sert à aucun autre craft et ne brûle pas."
        recettes:
          - "ks_crafts:coffre_renforce"
        requiert: "KS_CoffreRenforce"
        nouveau: "2026-10-25"

  alcools:
    nom: "Alcools et alambic"
    icone: POTION
    resume: "Alcools à l'alambic, combustible, Molotov, bandage, torche."
    requiert: "KS_Alcools"
    nouveautes:
      neutre:
        nom: "Alcool neutre"
        icone: POISONOUS_POTATO
        texte: "Fiole d'eau + patate empoisonnée à l'alambic. C'est la base de tous les alcools, et un combustible : 50 cuissons dans un four, un fumoir ou un haut fourneau. La fiole vide reste dans la case ; un entonnoir sous le four la récupère."
        nouveau: "2026-10-28"
      alcools:
        nom: "Les alcools"
        icone: HONEY_BOTTLE
        texte: "Alcool neutre + fleur de cactus : tequila (résistance) ; + patate : vodka (lévitation, en pause quand tu t'accroupis) ; + bouteille de miel : hydromel (célérité) ; + pomme : manzana (bonus de vie) ; + blé : bière (grâce du dauphin) ; + crème de magma : tabascoolisé (ni gel ni poudreuse). Redstone, glowstone et poudre à canon comme pour les potions. Attention, un alcool peut donner la nausée !"
        nouveau: "2026-10-28"
      molotov:
        nom: "Cocktail Molotov"
        icone: FIRE_CHARGE
        texte: "Alcool neutre + papier. Lancé, il met le feu sur 3 × 3 blocs et allume les creepers. Il ne prend pas dans le claim d'un autre joueur."
        recettes:
          - "ks_alcools:molotov"
        nouveau: "2026-10-28"
      bandage:
        nom: "Bandage"
        icone: PAPER
        texte: "8 papiers autour d'un alcool neutre. Il s'applique comme on mange du kelp séché, même rassasié, et rend 1,5 cœur. Il ne nourrit pas."
        recettes:
          - "ks_alcools:bandage"
        nouveau: "2026-10-28"
      torche:
        nom: "Torche augmentée"
        icone: TORCH
        texte: "Torche + papier + alcool neutre donnent 4 torches augmentées. Posée, elle éclaire tout sur 15 blocs autour d'elle (pas dans le claim d'un autre joueur) : plus de monstres alentour."
        recettes:
          - "ks_alcools:torche_augmentee"
        nouveau: "2026-10-28"

  cuisine:
    nom: "Cuisine"
    icone: COOKIE
    resume: "Nouveaux aliments, cookies à effets, pomme d'amour."
    requiert: "KS_Cuisine"
    nouveautes:
      pomme-amour:
        nom: "Pomme d'amour"
        icone: APPLE
        texte: "Pomme entourée de 8 sucres. Donne-la à deux mobs de la même espèce qui ne se reproduisent pas, même hostiles : ils tombent amoureux et un bébé naît. Les petits nouveaux ont leur propre tête... Mangée par deux joueurs qui se touchent, elle réserve une autre surprise."
        recettes:
          - "ks_cuisine:pomme_amour"
        nouveau: "2026-10-29"
      cookies:
        nom: "Cookies aux baies"
        icone: COOKIE
        texte: "Un cookie et 3 baies sucrées : plus nourrissant, et pendant 3 minutes les animaux craintifs (renards, lapins, ocelots...) ne te fuient plus. Un cookie et 3 baies lumineuses : tu éclaires autour de toi pendant 3 minutes."
        recettes:
          - "ks_cuisine:cookie_baie_sucree"
          - "ks_cuisine:cookie_baie_lumineuse"
        nouveau: "2026-10-29"
      sandwich-brunch:
        nom: "Sandwich et brunch"
        icone: BREAD
        texte: "Pain, côtelette cuite et seau de lait : un sandwich jambon-beurre qui nourrit très bien (le seau revient). Côtelette crue et œuf : un brunch."
        recettes:
          - "ks_cuisine:sandwich"
          - "ks_cuisine:brunch"
        nouveau: "2026-10-29"
      cereales:
        nom: "Blé soufflé et céréales"
        icone: WHEAT
        texte: "Du blé au four ou au fumoir donne du blé soufflé, qui se grignote vite. 8 blés soufflés autour d'un seau de lait : un bol de céréales qui remet à zéro ton temps sans dormir (plus de phantoms), sans t'enlever tes effets."
        recettes:
          - "ks_cuisine:ble_souffle"
          - "ks_cuisine:ble_souffle_fumoir"
          - "ks_cuisine:bol_cereales"
        nouveau: "2026-10-29"

  atouts:
    nom: "Atouts d'équipement"
    icone: LEATHER_BOOTS
    resume: "Un pouvoir temporaire pour tes bottes et ton casque."
    requiert: "KS_Atouts"
    nouveautes:
      regles:
        nom: "Comment ça marche"
        icone: CRAFTING_TABLE
        texte: "Entoure une pièce d'équipement de 8 ressources à l'établi : elle gagne un atout pour 1 heure, qui ne s'écoule que quand tu la portes. Refais le craft pour ajouter une heure ; un autre atout remplace le premier. L'objet change d'apparence mais garde sa protection, ses enchantements et son usure. Temps restant : dans sa description et dans /effects."
        nouveau: "2026-10-29"
      ski:
        nom: "Bottes de ski"
        icone: RABBIT_FOOT
        texte: "8 pieds de lapin autour de bottes : tu marches sur la poudreuse."
        recettes:
          - "ks_atouts:ski"
        nouveau: "2026-10-29"
      poiscaille:
        nom: "Casque poiscaille"
        icone: PUFFERFISH
        texte: "8 poissons-globes autour d'un casque : tu vois clair sous l'eau."
        recettes:
          - "ks_atouts:poiscaille"
        nouveau: "2026-10-29"
      coupe-feu:
        nom: "Bottes coupe-feu"
        icone: MAGMA_CREAM
        texte: "8 crèmes de magma autour de bottes : les blocs de magma ne te brûlent plus."
        recettes:
          - "ks_atouts:coupe_feu"
        nouveau: "2026-10-29"

  enclume:
    nom: "Enclume, meule, expérience"
    icone: ANVIL
    resume: "Réparer, stocker son expérience, purifier."
    nouveautes:
      sans-limite:
        nom: "Plus de « Trop cher ! »"
        icone: ANVIL
        texte: "L'enclume répare et fusionne sans limite de prix. Au-delà de 50 niveaux, le coût est réduit de moitié."
        nouveau: "2026-10-18"
      cout:
        nom: "Coût de réparation"
        icone: IRON_SWORD
        texte: "La description de chaque équipement indique combien de niveaux coûte sa réparation complète."
        nouveau: "2026-10-18"
      en-coffre:
        nom: "Enclume en coffre"
        icone: CHEST
        texte: "Accroupi + clic droit sur une enclume : pose deux objets de ton inventaire, le résultat et son coût s'affichent, puis Valider. Calculé par le serveur, sans limite de prix (pratique sur Bedrock). Elle s'use comme une enclume normale. Pour renommer : clic droit sans s'accroupir."
        nouveau: "2026-10-25"
      fioles:
        nom: "Fioles d'expérience"
        icone: EXPERIENCE_BOTTLE
        texte: "Accroupi + clic droit sur une enclume, fiole vide en main : choisis combien de niveaux stocker. Lance la fiole pour les récupérer."
        nouveau: "2026-10-18"
      meule:
        nom: "Retirer une malédiction"
        icone: GRINDSTONE
        texte: "Accroupi, main vide, clic droit sur une meule, puis choisis un objet maudit. Chaque malédiction coûte 1 Cristal de purification (coffres de récompense)."
        nouveau: "2026-10-18"

  economie:
    nom: "Économie"
    icone: EMERALD
    resume: "L'émeraude devient la monnaie."
    nouveautes:
      score:
        nom: "Ton score"
        icone: EMERALD
        texte: "1 émeraude = 1 point. Dépose et retire tes émeraudes dans /economie. Ton solde s'affiche dans la liste Tab ; masqué, il perd 1 % par jour."
        commande: "/economie"
        nouveau: "2026-10-18"
      blocs:
        nom: "Blocs compressés"
        icone: EMERALD_BLOCK
        texte: "Retire de grosses sommes en blocs d'émeraude compressés (tiers 1 à 6), qu'on ne peut ni poser ni décrafter."
        nouveau: "2026-10-18"
      magasin:
        nom: "Ton magasin"
        icone: OAK_SIGN
        texte: "Dans la zone du spawn, crée ton magasin dans un de tes claims (450 points), puis agrandis-le jusqu'à 20 boutiques. Une boutique = un panneau posé sur un coffre. Les autres achètent même à distance."
        commande: "/magasin"
        nouveau: "2026-10-18"
      catalogue:
        nom: "Catalogue des magasins"
        icone: OAK_HANGING_SIGN
        texte: "Tous les magasins des autres joueurs, classés par ventes, avec recherche et favoris. Le lingot d'or en bas ouvre les rachats de la semaine."
        commande: "/magasins (ou /shop, /market)"
        nouveau: "2026-10-18b"
      rachats:
        nom: "Rachats de la semaine"
        icone: HOPPER
        texte: "Chaque lundi, 10 objets que le serveur t'achète en points. Après 2 500 points gagnés ainsi, un quota par objet et par jour s'applique."
        commande: "/rachat"
        nouveau: "2026-10-18"
      echange:
        nom: "Échanges"
        icone: PLAYER_HEAD
        texte: "Propose un échange à un joueur à 5 blocs au plus ; il répond avec /accepter. Objets et points sur un même panneau, validé par les deux."
        commande: "/echange <joueur>"
        nouveau: "2026-10-18"
      marchand:
        nom: "Marchand ambulant"
        icone: WANDERING_TRADER_SPAWN_EGG
        texte: "Les villageois n'ont plus d'échanges. Le marchand ambulant, lui, rachète 10 lots en points, en stock limité."
        nouveau: "2026-10-18"

  claims:
    nom: "Claims"
    icone: GOLDEN_SHOVEL
    resume: "Protéger son terrain."
    nouveautes:
      creer:
        nom: "Créer un claim"
        icone: GRASS_BLOCK
        texte: "/claim protège le chunk où tu te trouves, sur toute la hauteur. Les 10 premiers sont gratuits, puis le prix monte (237 points pour le 11e). 100 au plus."
        commande: "/claim"
        nouveau: "2026-10-18b"
      gerer:
        nom: "Gérer tes claims"
        icone: WRITABLE_BOOK
        texte: "Nom, description, réglages des membres et des visiteurs, expulser un joueur."
        commande: "/claims"
        nouveau: "2026-10-18b"
      membres:
        nom: "Membres et groupes"
        icone: PLAYER_HEAD
        texte: "Jusqu'à 5 membres par claim. Un groupe applique les mêmes membres et réglages à plusieurs claims."
        nouveau: "2026-10-18"
      vente:
        nom: "Vendre un claim"
        icone: GOLD_INGOT
        texte: "Mets-le en vente ; l'acheteur se tient dedans et fait /claim. Supprimer un claim rembourse le dernier prix payé."
        nouveau: "2026-10-18"
      gratuits:
        nom: "Claims gratuits en plus"
        icone: GOLDEN_SHOVEL
        texte: "Un jeton de claim, utilisé depuis /claims, donne un claim gratuit de plus sans faire monter les prix. Le claim de ta maison au spawn ne compte pas non plus."
        nouveau: "2026-10-18"

  deplacements:
    nom: "Se déplacer"
    icone: COMPASS
    resume: "Maison, téléportations, vol, jetons."
    nouveautes:
      maison:
        nom: "Ta maison au spawn"
        icone: LODESTONE
        texte: "/maison create dans un de tes claims de la zone du spawn (500 points) : /spawn t'y ramène. Pour la déplacer : /setspawn, une boussole liée à une magnétite en main."
        commande: "/maison create"
        nouveau: "2026-10-18"
      home:
        nom: "Téléportations"
        icone: ENDER_PEARL
        texte: "Vers ton lit (/bed), ta maison ou tes emplacements. Une gratuite par heure, puis un jeton ou 20 points. Reste 5 secondes sans bouger."
        commande: "/home"
        nouveau: "2026-10-18b"
      localisation:
        nom: "Jeton de localisation"
        icone: COMPASS
        texte: "Une boussole liée à une magnétite entourée de 8 blocs de cuivre ciré. Pose-le dans une case de tes localisations (/jetons) : la magnétite devient une destination de /home. Repris, il t'est rendu et la case attend 24 h. Le badge de localisation donne les cases."
        recettes:
          - "ks_teleport:jeton_localisation"
        nouveau: "2026-10-18b"
      fly:
        nom: "Voler chez soi"
        icone: FEATHER
        texte: "Vole dans tes claims : un jeton donne 10 minutes, un badge une réserve qui se recharge chaque heure. Hors de tes claims, le vol s'arrête."
        commande: "/fly"
        nouveau: "2026-10-18"
      jetons:
        nom: "Jetons et badges"
        icone: NETHERITE_INGOT
        texte: "Un seul coffre : une case par badge, une case par jeton (autant que tu veux) et tes cases de localisation. Maj + clic sur un jeton ou un badge de ton inventaire pour le ranger. Deux badges identiques fusionnent à l'enclume."
        commande: "/jetons (ou /jeton, /badges, /badge)"
        nouveau: "2026-10-18b"

  recompenses:
    nom: "Mort et récompenses"
    icone: ENDER_CHEST
    resume: "Rien ne se perd, tout s'ouvre."
    nouveautes:
      coffre-mort:
        nom: "Coffre de mort"
        icone: CHEST
        texte: "À ta mort, tes objets vont dans un coffre que toi seul peux ouvrir pendant 1 heure, avec la moitié de ton expérience en fiole."
        nouveau: "2026-10-18"
      claim-autre:
        nom: "Mort chez un autre"
        icone: IRON_DOOR
        texte: "Si tu meurs dans le claim d'un autre joueur, tes objets t'attendent directement dans /rewards."
        nouveau: "2026-10-18"
      coffres:
        nom: "Tes coffres de mort"
        icone: RECOVERY_COMPASS
        texte: "Leur position et le temps restant. Un jeton ou un badge de la mort les récupère à distance."
        commande: "/coffres"
        nouveau: "2026-10-18"
      rewards:
        nom: "Récompenses"
        icone: ENDER_CHEST
        texte: "Les gains des mini-jeux et de Kanvas arrivent ici, en coffres « Non ouvert » avec leur valeur moyenne. Clic droit, coffre en main, pour l'ouvrir (au-delà de 100 émeraudes, confirme l'ouverture). Sur un coffre ou un tonneau, c'est lui qui s'ouvre : tu peux y ranger ton coffre."
        commande: "/rewards"
        nouveau: "2026-10-25"
      fusion:
        nom: "Fusion de coffres"
        icone: ANVIL
        texte: "Accroupi + clic droit sur une enclume, puis pose deux coffres de récompense non ouverts : ils fusionnent en un plus gros, contre des points d'expérience."
        nouveau: "2026-10-25"

  parrainage:
    nom: "Parrainage"
    icone: TOTEM_OF_UNDYING
    resume: "Fais venir tes amis : vous gagnez tous les deux des coffres."
    requiert: "KS_Parrainage"
    nouveautes:
      parrainer:
        nom: "Parrainer un ami"
        icone: PLAYER_HEAD
        texte: "Menu Contacts > « Parrainer un joueur » : choisis un ami sans parrain (ou écris son pseudo), même s'il joue déjà sur Kixster. Dès qu'il accepte, il est whitelisté."
        commande: "/parrainage"
        nouveau: "2026-10-23b"
      coffres-parrainage:
        nom: "Des coffres qui grossissent"
        icone: ENDER_CHEST
        texte: "Plus ton filleul joue (temps actif, pas l'AFK), plus vos coffres de récompense sont gros : un pour lui, un pour toi, à chaque palier. Un filleul qui jouait déjà sur Kixster rattrape d'un coup les paliers de son temps de jeu passé. « Mes filleuls » montre où il en est."
        nouveau: "2026-10-23b"
      responsable:
        nom: "Choisis bien qui tu invites"
        icone: BARRIER
        texte: "Faire venir à répétition des joueurs qui ne respectent pas les règles peut te valoir une sanction, à toi aussi."
        nouveau: "2026-10-23"
      sans-parrain:
        nom: "Sans parrain"
        icone: PAPER
        texte: "Un joueur qui n'est pas whitelisté voit une fenêtre de demande en essayant de rejoindre Kixster : il donne son pseudo Discord, un admin la traite dès que possible."
        nouveau: "2026-10-23b"

  contrats:
    nom: "Contrats"
    icone: WRITABLE_BOOK
    resume: "Engage-toi avec d'autres joueurs, garanties à la clé."
    requiert: "KS_Contrats"
    nouveautes:
      contrat:
        nom: "Passer un contrat"
        icone: WRITABLE_BOOK
        texte: "/contrat > « Créer un contrat » : choisis ton équipe (facultatif), les joueurs d'en face, à quoi chaque partie s'engage, une durée et une garantie. Le contrat est actif quand tous ont accepté : il garde une trace de vos engagements."
        commande: "/contrat"
        nouveau: "2026-10-27"
      biens-services:
        nom: "Biens ou services"
        icone: CHEST
        texte: "Un engagement est un bien (jusqu'à 5 objets différents, et des points, avec leur quantité) ou un service (creuser une zone, faire un build...). Un contrat peut se faire une fois ou se répéter : chaque jour, chaque semaine, toutes les 2 semaines ou chaque mois."
        nouveau: "2026-10-27"
      livrer:
        nom: "Livrer par /echange"
        icone: HOPPER
        texte: "Dans /echange, choisis le contrat : seuls ses objets et ses points passent, sans dépasser ce qui reste à livrer, et la livraison est comptée dans le contrat (10/64)."
        nouveau: "2026-10-27"
      accord:
        nom: "Tout se décide ensemble"
        icone: PLAYER_HEAD
        texte: "Modifier, valider en avance ou annuler un contrat : la demande doit être acceptée par tous les autres joueurs du contrat. Un seul refus la fait tomber. Tu peux aussi proposer ta propre version d'une proposition reçue."
        nouveau: "2026-10-27"
      garantie:
        nom: "Garantie"
        icone: GOLD_INGOT
        texte: "Chaque partie peut mettre des points en garantie, partagés entre ses joueurs : ils sont retenus jusqu'à la fin du contrat, puis rendus."
        nouveau: "2026-10-27"
      litige:
        nom: "En cas de non-respect"
        icone: RED_BANNER
        texte: "À la fin d'une période ou du contrat, chacun valide ou conteste (7 jours sans réponse : validé ; tout livré par /echange : validé d'office). Contester ou signaler un non-respect bloque les garanties : un admin tranche et peut les répartir comme il le juge juste."
        nouveau: "2026-10-27"
      perso:
        nom: "Tes contrats, à ta façon"
        icone: NAME_TAG
        texte: "Donne à chaque contrat ton propre nom et ton propre logo, et mets tes préférés en favoris : ils passent en tête de liste. Seul toi les vois."
        nouveau: "2026-10-27"

  vehicules:
    nom: "Véhicules"
    icone: OAK_BOAT
    resume: "Bateaux en musique, trains, véhicules protégés."
    nouveautes:
      jukebox:
        nom: "Bateau à jukebox"
        icone: JUKEBOX
        texte: "Bateau + jukebox. Accroupi + clic droit (à bord : touche de saut) pour choisir un disque de ton inventaire ; la musique suit le bateau."
        recettes:
          - "ks_crafts:bateau_jukebox_*"
        nouveau: "2026-10-18"
      jukebox-coffre:
        nom: "Bateau à coffre et jukebox"
        icone: OAK_CHEST_BOAT
        texte: "Bateau à coffre + jukebox. Il lit en boucle les disques de son coffre ; clic droit : lecture ou pause. Tire-le derrière toi avec une laisse."
        recettes:
          - "ks_crafts:bateau_coffre_jukebox_*"
        nouveau: "2026-10-18"
      coffre-renforce:
        nom: "Bateau et minecart avec coffre renforcé"
        icone: CHEST_MINECART
        texte: "Bateau (ou radeau) + coffre renforcé, ou minecart + coffre renforcé, à l'établi : 1 000 stacks d'un seul objet qui voyagent. Même menu et mêmes entonnoirs que le coffre renforcé ; le minecart s'attelle à un train. Il ne se casse qu'avec 27 stacks ou moins dedans, qui tombent alors au sol."
        requiert: "KS_CoffreRenforce 1.1.0"
        nouveau: "2026-10-28"
      decraft:
        nom: "Décrafter un véhicule spécial"
        icone: CRAFTING_TABLE
        texte: "Seul dans l'établi, un bateau à jukebox, un wagon jukebox ou un véhicule avec coffre renforcé rend son jukebox ou son coffre renforcé, et le bateau ou le minecart reste dans la grille."
        requiert: "KS_Crafts 1.23.0"
        nouveau: "2026-10-28"
      laisse:
        nom: "Laisse courte"
        icone: LEAD
        texte: "Un bateau tiré en laisse par un autre bateau le suit à 3 blocs, comme une remorque : il prend les virages derrière lui."
        requiert: "KS_LaisseBateau"
        nouveau: "2026-10-18d"
      verrou:
        nom: "Verrou de véhicule"
        icone: TRIPWIRE_HOOK
        texte: "Crochet + 4 lingots de fer. Clic droit sur un bateau ou wagonnet à coffre, un âne, une mule ou un lama : tant qu'il n'est pas vide, personne d'autre ne l'ouvre, ne le casse ni ne le déplace."
        recettes:
          - "ks_crafts:verrou_vehicule"
        nouveau: "2026-10-18"
      partout:
        nom: "Bateaux et wagonnets"
        icone: MINECART
        texte: "Ils se posent partout, même dans les zones protégées et les claims. Ceux sans coffre se cassent partout."
        nouveau: "2026-10-18"
      locomotive:
        nom: "Train : la locomotive"
        icone: FURNACE_MINECART
        texte: "3 wagonnets à four en ligne à l'établi. Pose-la sur 4 rails droits, dans le sens de ton regard : elle tracte 15 wagons, et 10 de plus par wagonnet à four ajouté."
        requiert: "KS_Trains"
        recettes:
          - "ks_crafts:locomotive"
        nouveau: "2026-10-18c"
      attelage:
        nom: "Train : atteler"
        icone: IRON_CHAIN
        texte: "Chaîne en main, clic droit sur un wagon puis sur un autre, à l'arrêt sur les rails : ils s'attellent. Cisailles : dételer. 64 wagons au plus."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      menu-train:
        nom: "Train : le menu"
        icone: COMPARATOR
        texte: "Accroupi + clic droit sur un four de la locomotive ou sur le wagon contrôleur : la liste des wagons, marche / arrêt, vitesse, dételage, réglages des coffres. Chaque wagon peut y être renommé, et son contenu ouvert depuis le menu."
        requiert: "KS_Trains"
        nouveau: "2026-10-18d"
      controleur:
        nom: "Train : wagon contrôleur"
        icone: REDSTONE_LAMP
        texte: "Un wagonnet entouré, en casque, d'un comparateur, d'un capteur sculk calibré, d'une lampe à redstone, d'un bloc musical et d'un levier, chacun une fois et dans n'importe quel ordre. Monte dedans : avancer = vitesse +1 (4 niveaux), reculer = vitesse -1 puis marche arrière, saut = klaxon (un sifflet, ou une corne de chèvre posée dans le contrôleur). Un seul par train, à moins de 5 wagons de la locomotive."
        requiert: "KS_Trains"
        recettes:
          - "ks_crafts:wagon_controleur_ordre"
        nouveau: "2026-10-18d"
      carburant:
        nom: "Train : carburant"
        icone: COAL
        texte: "Clic droit sur un four : sa case de carburant (tout combustible, et l'alcool neutre : 500 blocs, la fiole vide reste dans la case). Il brûle selon la distance, la vitesse et la charge : plus le train est long, plus il lui faut de fours."
        requiert: "KS_Trains"
        nouveau: "2026-10-28"
      wagon-entonnoir:
        nom: "Train : wagon à entonnoir"
        icone: HOPPER_MINECART
        texte: "Il passe les objets des 3 wagons derrière lui vers les 3 wagons devant lui, et remplit les fours de carburant."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      wagon-coffre:
        nom: "Train : wagon à coffre"
        icone: CHEST_MINECART
        texte: "Dans le menu du train, choisis si les entonnoirs du train peuvent y déposer ou y prendre des objets."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      wagon-jukebox:
        nom: "Train : wagon jukebox"
        icone: JUKEBOX
        texte: "Wagonnet + jukebox. Il joue les disques du wagon à coffre juste devant lui : lecture, aléatoire ou pause."
        requiert: "KS_Trains"
        recettes:
          - "ks_crafts:wagon_jukebox"
        nouveau: "2026-10-18c"
      voyageurs:
        nom: "Train : voyageurs"
        icone: MINECART
        texte: "Les autres joueurs peuvent monter dans les wagonnets simples de ton train. Tes amis (/amis) ont tous les droits dessus."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"
      boussole-train:
        nom: "Train : le retrouver"
        icone: COMPASS
        texte: "Clic droit sur le wagon contrôleur avec une boussole : elle suit le train. Une étiquette renommée sur un four de la locomotive lui donne un nom."
        requiert: "KS_Trains"
        nouveau: "2026-10-18c"

  interface:
    nom: "Menus et fair-play"
    icone: NETHER_STAR
    resume: "Menus, tableau et règles du jeu."
    nouveautes:
      menu:
        nom: "Le menu du serveur"
        icone: NETHER_STAR
        texte: "Économie, claims, téléportations, jetons, récompenses... /menu on donne l'étoile du Nether qui l'ouvre."
        commande: "/kixster"
        nouveau: "2026-10-18"
      didacticiel:
        nom: "Ce didacticiel"
        icone: BOOK
        texte: "Il explique tout ce qui change sur Kixster. Ouvre-le à tout moment, ou depuis « Informations » (/infos). Une question ? « Poser une question », en bas de l'écran des thèmes : le staff te répond en jeu et complète le didacticiel si besoin."
        commande: "/help ou /didacticiel"
        nouveau: "2026-10-18e"
      tableau:
        nom: "Tableau"
        icone: OAK_HANGING_SIGN
        texte: "Affiche sur le côté de l'écran ton score, ton exploration du jour, tes claims, tes coordonnées et ton biome."
        commande: "/tableau"
        nouveau: "2026-10-18"
      exploration:
        nom: "Exploration du jour"
        icone: SPYGLASS
        texte: "Coffres de structures, spawners naturels, blocs suspects : 10 découvertes par jour. Un certain élixir lève la limite."
        nouveau: "2026-10-18"
      fair-play:
        nom: "Fair-play"
        icone: ENDER_EYE
        texte: "Anti-xray actif ; les mini-cartes n'ont ni radar d'entités ni vue des grottes."
        nouveau: "2026-10-18"
      mods-interdits:
        nom: "Mods et astuces interdits"
        icone: BARRIER
        texte: "Interdits : x-ray (mods, packs de textures), Litematica en mode « easy place » ou « printer », macros et clics automatiques, mini-cartes qui contournent le radar ou la vue des grottes, toute freecam autre que Legacy Freecam. Le staff surveille."
        nouveau: "2026-10-18d"
      statistiques:
        nom: "Statistiques"
        icone: CLOCK
        texte: "Ton temps de jeu (et ton temps actif, sans l'AFK), tes distances, tes blocs minés, tes créatures tuées... comme l'écran Statistiques de Java, aussi pour les joueurs Bedrock. Dans « Informations »."
        commande: "/statistiques (/stats)"
        requiert: "KLM_Statistiques"
        nouveau: "2026-10-23b"
      effets:
        nom: "Tes effets"
        icone: GLASS_BOTTLE
        texte: "Tous tes effets en cours, ceux du jeu et ceux du serveur, avec leur temps restant. Clique sur un effet pour suivre son temps en barre de boss ou en barre d'action."
        commande: "/effects (/effets)"
        requiert: "KS_Effets"
        nouveau: "2026-10-28"
      reseau:
        nom: "Le réseau"
        icone: BELL
        texte: "/global pour le tchat entre serveurs, /amis et /mp pour tes amis, et le chat vocal (Simple Voice Chat)."
        nouveau: "2026-10-18"

  commandes:
    nom: "Commandes"
    icone: COMMAND_BLOCK
    resume: "Toutes les commandes de Kixster, avec ce qu'elles font."
    nouveautes:
      kixster:
        nom: "/kixster"
        icone: NETHER_STAR
        texte: "Ouvre le menu du serveur. /menu on | off donne ou retire les objets de menu de ta barre."
        nouveau: "2026-10-18c"
      infos:
        nom: "/infos"
        icone: COMPARATOR
        texte: "Ouvre « Informations » : didacticiel, récompenses, contacts."
        nouveau: "2026-10-18c"
      help:
        nom: "/help, /didacticiel"
        icone: BOOK
        texte: "Ouvre ce didacticiel."
        nouveau: "2026-10-18c"
      serveurs:
        nom: "/serveurs"
        icone: COMPASS
        texte: "Change de serveur KaLium."
        nouveau: "2026-10-18c"
      economie:
        nom: "/economie (/eco)"
        icone: EMERALD
        texte: "Ton score : déposer et retirer tes émeraudes, masquer ton solde."
        nouveau: "2026-10-18c"
      echange:
        nom: "/echange <joueur>"
        icone: PLAYER_HEAD
        texte: "Propose un échange d'objets et de points à un joueur proche."
        nouveau: "2026-10-18c"
      accepter:
        nom: "/accepter"
        icone: LIME_DYE
        texte: "Accepte une demande d'échange."
        nouveau: "2026-10-18c"
      magasin:
        nom: "/magasin"
        icone: OAK_SIGN
        texte: "Ton magasin : le créer, l'agrandir, gérer tes boutiques."
        nouveau: "2026-10-18c"
      magasins:
        nom: "/magasins (/shop, /market)"
        icone: OAK_HANGING_SIGN
        texte: "Le catalogue des magasins des autres joueurs."
        nouveau: "2026-10-18c"
      rachat:
        nom: "/rachat"
        icone: HOPPER
        texte: "Les rachats de la semaine : vends des objets au serveur."
        nouveau: "2026-10-18c"
      claim:
        nom: "/claim"
        icone: GOLDEN_SHOVEL
        texte: "Claime le chunk où tu te trouves, ou achète le claim en vente."
        nouveau: "2026-10-18c"
      claims:
        nom: "/claims"
        icone: WRITABLE_BOOK
        texte: "Gère tes claims : membres, réglages, groupes, vente."
        nouveau: "2026-10-18c"
      home:
        nom: "/home"
        icone: ENDER_PEARL
        texte: "Tes téléportations : lit, maison du spawn, emplacements."
        nouveau: "2026-10-18c"
      bed:
        nom: "/bed"
        icone: RED_BED
        texte: "Téléportation à ton lit."
        nouveau: "2026-10-18c"
      spawn:
        nom: "/spawn"
        icone: LODESTONE
        texte: "Téléportation à ta maison du spawn."
        nouveau: "2026-10-18c"
      maison:
        nom: "/maison create"
        icone: OAK_DOOR
        texte: "Déclare ta maison au spawn, dans un de tes claims de la zone du spawn."
        nouveau: "2026-10-18c"
      setspawn:
        nom: "/setspawn"
        icone: COMPASS
        texte: "Place ton /spawn au-dessus d'une magnétite (boussole liée en main)."
        nouveau: "2026-10-18c"
      jetons:
        nom: "/jetons (/jeton, /badges, /badge)"
        icone: NETHERITE_INGOT
        texte: "Ton inventaire spécial : badges, jetons, localisations."
        nouveau: "2026-10-18c"
      fly:
        nom: "/fly"
        icone: FEATHER
        texte: "Ton temps de vol, tes jetons et ton badge de fly."
        nouveau: "2026-10-18c"
      coffres:
        nom: "/coffres"
        icone: CHEST
        texte: "Tes coffres de mort : position, temps restant, récupération."
        nouveau: "2026-10-18c"
      rewards:
        nom: "/rewards (/reward)"
        icone: ENDER_CHEST
        texte: "Tes récompenses en attente."
        nouveau: "2026-10-18c"
      tetes:
        nom: "/tetes"
        icone: ZOMBIE_HEAD
        texte: "Les têtes que tu as déjà obtenues."
        nouveau: "2026-10-18c"
      tableau:
        nom: "/tableau"
        icone: OAK_HANGING_SIGN
        texte: "Affiche ou masque le tableau sur le côté de l'écran."
        nouveau: "2026-10-18c"
      global:
        nom: "/global"
        icone: BELL
        texte: "/global send <message> : écris à tous les serveurs ; /global true | false : affiche ou masque ce tchat."
        nouveau: "2026-10-18c"
      amis:
        nom: "/amis"
        icone: PLAYER_HEAD
        texte: "Tes amis : ajouter, accepter, retirer, rejoindre."
        nouveau: "2026-10-18c"
      mp:
        nom: "/mp <joueur> <message>, /r"
        icone: PAPER
        texte: "Envoie un message privé ; /r répond au dernier."
        nouveau: "2026-10-18c"
      bloquer:
        nom: "/bloquer, /debloquer <joueur>"
        icone: BARRIER
        texte: "Bloque ou débloque les messages et demandes d'un joueur."
        nouveau: "2026-10-18c"
      groupe:
        nom: "/groupe"
        icone: TOTEM_OF_UNDYING
        texte: "Ton groupe de jeu, pour aller en partie ensemble."
        nouveau: "2026-10-18c"
      parrainage-cmd:
        nom: "/parrainage"
        icone: PLAYER_HEAD
        texte: "Parrainer un ami sur Kixster, voir tes filleuls, répondre à une proposition."
        requiert: "KS_Parrainage"
        nouveau: "2026-10-23"
      contrat-cmd:
        nom: "/contrat"
        icone: WRITABLE_BOOK
        texte: "Tes contrats avec les autres joueurs : en créer, répondre aux propositions, valider ou contester."
        requiert: "KS_Contrats"
        nouveau: "2026-10-27"
      statistiques-cmd:
