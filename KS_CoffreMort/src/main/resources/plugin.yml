name: KS_CoffreMort
version: '${project.version}'
main: fr.kalium.coffremort.KSCoffreMort
api-version: '26.2'
description: Coffres de mort du serveur Event (objets et moitie de l'experience gardes 1 heure), /coffres.
authors: [KaLium]
depend: [KLM_Menu]
softdepend: [KS_Menu, KS_Jetons, KS_RewardsGUI, WorldGuard, SimpleClaimSystem]
commands:
  coffres:
    description: Tes coffres de mort (coordonnees, temps restant, recuperation) ; /coffres tous pour les operateurs.
    usage: /coffres [tous]
    aliases: [coffremort]
permissions:
  kscoffremort.staff:
    description: /coffres tous - coffres de mort de tous les joueurs, apercu et transfert dans /rewards.
    default: op
