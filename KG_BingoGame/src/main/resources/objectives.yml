# ============================================================
#  KalBingo - liste des objectifs utilisables pour generer les grilles
# ============================================================
#
# ATTENTION : la liste ci-dessous n'est qu'un JEU D'EXEMPLES PLACEHOLDER pour permettre de
# tester la generation de grille (section 2 du cahier des charges). Ce n'est PAS une liste
# d'objectifs validee - voir to_do_list_Kal_Games_Bingo.txt section 13 : "la liste finale des
# objectifs n'est pas encore entierement definie [...] ne pas ajouter automatiquement des
# objectifs qui n'ont pas ete valides". A REMPLACER/COMPLETER avant l'ouverture.
#
# Ce fichier est charge depuis le dossier de donnees du plugin (pas depuis le .jar) : il peut
# etre modifie librement sans recompiler ni remplacer le plugin. Utilisez
# "/bingoadmin grid reload" pour appliquer les changements sans redemarrer le serveur.
#
# Format de chaque entree :
#   material   : identifiant d'item Minecraft (voir la liste des Material Bukkit/Paper), ex: DIAMOND
#   quantity   : quantite requise pour valider la case (optionnel, defaut 1)
#   difficulty : EASY | MEDIUM | HARD | EXTREME
#                (correspond aux couleurs du cahier des charges : bleu = EASY, jaune = MEDIUM,
#                orange = HARD, rouge = EXTREME)
#   condition  : condition particuliere de validation, texte libre (optionnel - affichee dans le
#                menu Objectifs mais NON verifiee : la validation automatique ne regarde que
#                l'item et la quantite)
#
# La taille de grille est configuree separement dans config.yml (grid.size). Ce fichier doit
# contenir au moins (grid.size x grid.size) objectifs pour qu'une grille puisse etre generee.

