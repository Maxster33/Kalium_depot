# ============================================================
#  KaliumCore - configuration
#  Plugin de menu pour serveur de survie, pense pour etre
#  reutilise tel quel sur d'autres serveurs (y compris temporaires).
# ============================================================

# Nom du lobby tel que declare dans le velocity.toml (bouton "Retour au lobby").
lobby-server: lobby

# Largeur des boutons du menu (1 a 1024).
button-width: 220

# Operateurs autorises a voir le bouton "Parametres" (en plus de la permission kaliumcore.admin,
# accordee par defaut aux joueurs "op" du serveur - via un plugin de permissions comme LuckPerms
# par exemple). Pseudo (insensible a la casse) ou UUID.
operators:
  - Maaxster
  - LeKiwi06

# Intervalle (en secondes) entre deux sauvegardes automatiques des statistiques des joueurs en ligne
# (en plus de la sauvegarde systematique a la deconnexion et a l'arret du serveur).
stats-autosave-seconds: 300

# Modules du menu. Chaque module a sa propre section "enabled: true/false", modifiable en jeu depuis
# l'ecran Parametres. Desactiver un module masque son bouton de menu (et ses statistiques associees
# le cas echeant) mais n'arrete jamais l'enregistrement en arriere-plan (ex. les statistiques
# continuent d'etre comptabilisees meme quand l'ecran Statistiques est desactive).
modules:
  stats:
    enabled: true
  claims:
    enabled: true
    # Un joueur peut reclamer un chunk depuis le menu (il doit s'y trouver).
    claim-action: true
    # Un joueur peut liberer un chunk qui lui appartient depuis le menu (il doit s'y trouver).
    unclaim-action: true
    # Protection des chunks reclames : casse/pose de blocs, utilisation des blocs interactifs
    # (coffres, etabli, enclume...) et degats PvP contre le proprietaire dans son propre chunk.
    protection: true
    # Chunk principal ("base") : definissable/modifiable par le joueur depuis le menu (il doit se
    # trouver sur un de ses chunks). Par defaut, la base est le premier chunk reclame.
    home-chunk: true
    # Conversion emplacement <-> objet transportable (pense pour circuler via un futur systeme de
    # commerce).
    item-conversion: true
    # Emplacements ("claim slots") donnes aux nouveaux joueurs. Un emplacement = un chunk reclame ;
    # aucune limite du nombre de chunks qu'un joueur peut posseder au-dela de ses emplacements (un
    # operateur peut toujours lui en donner davantage, y compris en tres grand nombre).
    default-slots: 6
    # Objet obtenu en convertissant un emplacement (voir item-conversion ci-dessus).
    token:
      material: PAPER
      name: "<gold><bold>Jeton d'emplacement"
      lore:
        - "<gray>Objet d'échange : convertis-le"
        - "<gray>en emplacement de claim"
        - "<gray>depuis le menu Claims."
  market:
    enabled: true
    # Nombre maximum d'annonces actives simultanees par joueur (0 = illimite).
    max-listings: 10
    # Duree de vie par defaut d'une annonce avant expiration automatique (l'objet revient alors
    # dans le coffre de recompenses du vendeur).
    listing-duration-days: 7

