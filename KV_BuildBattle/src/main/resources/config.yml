# KV_BuildBattle - reglages (cahier des charges : KV_BuildBattle/CAHIER_DES_CHARGES.md)

# Monde a part du Build Battle (monde vide, cree au premier demarrage).
monde: buildbattle

# Disposition de l'arene dans ce monde : une colonne de boites par partie.
disposition:
  # Coin le plus bas (x, y, z) de la 1re boite de la 1re colonne. Loin du point d'apparition du monde (0, 80, 0),
  # ou l'on construit la salle d'attente avant de la capturer.
  origine-x: 10000
  origine-y: 64
  origine-z: 0
  # 4 parties simultanees de 8 equipes au plus.
  colonnes: 4
  boites-par-colonne: 8
  # Distance entre le bord ouest de deux colonnes (vers l'est) : assez pour ne pas voir les pseudos des autres
  # parties. Ne pas changer une fois l'arene generee (les boites deja collees ne seraient plus retrouvees).
  pas-colonnes: 600
  # Blocs vides entre deux boites d'une meme colonne (vers le sud).
  ecart-boites: 8
  # Blocs vides entre la salle d'attente d'une colonne (au nord) et sa 1re boite.
  ecart-salle: 32

# Capture et collage : taille maximale d'une capture (blocs par cote) et cout maximal par tick
# (1 par bloc lu, 4 par bloc modifie), pour ne pas bloquer le serveur.
taille-max: 256
blocs-par-tick: 10000

# 0.2.0 : arrivee des joueurs envoyes par KG_BuildBattle (kal-games). Leur affectation est lue sur le relais HTTP
# (KaliumRelay, sur le proxy). Valeurs par defaut dans le code : cles a ajouter a la main dans le config.yml du serveur.
relay-url: "http://7018.mystrator.com:46199"
# Jeton du relais : a renseigner UNIQUEMENT dans le config.yml du serveur, jamais ici (depot public, REGLES.md
# section 2). Meme valeur que "token" dans relay.properties du proxy.
relay-token: ""
# Nom Velocity du serveur ou renvoyer un joueur quand toutes les arenes sont occupees.
serveur-retour: kal-games

# 0.3.0 : deroulement d'une partie (valeurs par defaut dans le code ; cles a ajouter a la main pour les changer).
durees:
  # Compte a rebours de la file publique, des qu'il y a de quoi faire 2 equipes (depart immediat a 8 equipes).
  depart: 30
  # Ecriture des themes (mode « themes ecrits » des parties privees), puis vote du theme.
  ecriture-theme: 60
  vote-theme: 30
  # Vote de chaque terrain ; chaque phase passe a 3 s quand tout le monde a repondu.
  vote-terrain: 30
  # Affichage des resultats avant le retour sur kal-games.
  resultats: 15

# Themes tires au hasard (5 par partie). Vide = la liste integree au plugin (200 themes, voir Jeu.THEMES).
# Pour une autre liste, l'ecrire ici (un theme par ligne, « - Theme »), avec un editeur de texte sur le PC (accents).
themes: []
