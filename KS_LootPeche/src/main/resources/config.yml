# KS_LootPeche
# Prises rares (1.3.0) : par catégorie. Chaque prise a 1 chance sur « chance » de tomber sur la catégorie ; l'objet est
# alors tiré parmi ses « objets », à chances égales. Un seul tirage par prise ; l'objet remplace la prise.
# Objets : « tete:<id> » = tête de KS_Decapitator (id de /kaliumgive sans « tete_ », ex. tete:axolotl_bleu) ;
# « fiole_sinistre » (Mauvais présage, niveau I à V au hasard) ; « pomme_de_notch ».
# La tête de wither squelette a toujours ses 3 défauts (KS_Decapitator). Redémarrer le serveur après un changement.
# (La section « prises-rares » de la 1.2.0, une chance par objet, n'est plus lue.)
categories:
  tetes-communes:
    chance: 1000
    objets:
      - tete:morue
      - tete:saumon
      - tete:poisson_globe
      - tete:poisson_tropical
      - tete:poulpe
      - tete:bebe_poulpe
      - tete:poulpe_luisant
      - tete:bebe_poulpe_luisant
      - tete:tortue
      - tete:bebe_tortue
      - tete:nautile
      - tete:bebe_nautile
      - tete:tetard
      - tete:gardien
      - tete:noye
      - tete:axolotl_rose
      - tete:bebe_axolotl_rose
      - tete:axolotl_brun
      - tete:bebe_axolotl_brun
      - tete:axolotl_dore
      - tete:bebe_axolotl_dore
      - tete:axolotl_cyan
      - tete:bebe_axolotl_cyan
  tetes-peu-communes:
    chance: 5000
    objets:
      - tete:dauphin
      - tete:bebe_dauphin
      - tete:nautile_zombie
      - tete:nautile_zombie_des_coraux
  tetes-rares:
    chance: 25000
    objets:
      - tete:axolotl_bleu
      - tete:bebe_axolotl_bleu
      - tete:bebe_noye
  tete-grand-gardien:
    chance: 100000
    objets:
      - tete:grand_gardien
  tete-wither-squelette:
    chance: 50000
    objets:
      - tete:wither_squelette
  fiole-sinistre:
    chance: 50000
    objets:
      - fiole_sinistre
  pomme-de-notch:
    chance: 75000
    objets:
      - pomme_de_notch
