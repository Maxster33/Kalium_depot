name: KLM_Menu
version: '${project.version}'
main: fr.kalium.menu.KlmMenu
api-version: '26.2'
description: Interfaces du reseau KaLium (navigation entre serveurs, comparateur Informations (classements, parametres), boite a outils des menus). Present sur tous les serveurs Paper.
authors: [KaLium]
# 2.0.0 : demarre avant la creation des mondes, pour que des plugins en load: STARTUP (KG_BingoGame, generateur de
# monde de Kixster) puissent en dependre. KLM_Menu ne cree aucun monde.
load: STARTUP

commands:
  servers:
    description: Ouvre le menu de navigation entre les serveurs.
    aliases: [serveurs, navigation]
    usage: /<command>
  lobby:
    description: Retourne au lobby.
    usage: /<command>
  menu:
    description: Ouvre le menu du serveur (choix s'il y en a plusieurs) ; /menu on | off remet ou retire les objets de menu de la barre.
    usage: /<command> [on|off]
  informations:
    description: Ouvre « Informations » (classements ; parametres pour les admins), comme le comparateur.
    aliases: [infos]
    usage: /<command>
  kaliummenu:
    description: Administration du plugin KLM_Menu.
    aliases: [kmenu, klm]
    usage: /<command> reload | give [joueur]
    permission: kaliummenu.admin

permissions:
  kaliummenu.admin:
    description: Permet de recharger la configuration.
    default: op
  kaliummenu.bypass:
    description: Sans effet depuis la 2.4.0 (boussole et comparateur verrouilles pour tout le monde).
    default: op
