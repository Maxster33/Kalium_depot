name: KS_Teleport
version: '${project.version}'
main: fr.kalium.teleport.KSTeleport
api-version: '26.2'
description: Teleportations du serveur Event (/home, /spawn, /maison, /setspawn), jetons de localisation et magnetites.
authors: [KaLium]
depend: [KLM_Menu, KS_Jetons]
softdepend: [KS_Menu, KS_Economy, KS_Dimensions, WorldGuard, SimpleClaimSystem]
commands:
  home:
    description: Tes teleportations (lit, maison du spawn, emplacements) ; /home bed va a ton lit.
    usage: /home [bed]
  spawn:
    description: Te teleporte a ta maison du spawn (apres /maison create).
    usage: /spawn
  maison:
    description: Ta maison du spawn (dans un de tes claims de la zone du spawn).
    usage: /maison [create]
  setspawn:
    description: Place le point de /spawn de ta maison au-dessus de la magnetite de la boussole tenue en main (boussole utilisee).
    usage: /setspawn
