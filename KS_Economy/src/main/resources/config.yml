# KS_Economy - reglages (valeurs par defaut aussi ecrites dans le code).

conversion:
  # Points recus par emeraude deposee (taxe de conversion ; 1 = 1:1, 0.9 = 10 % de taxe).
  depot: 1.0
  # Points payes par emeraude retiree (1 = 1:1, 1.1 = 10 % de taxe).
  retrait: 1.0

masquage:
  # Part du solde prelevee chaque jour a minuit (heure de Paris) quand il est masque, en %.
  pourcent-par-jour: 1.0

# 1.1.0 - magasins (a ajouter a la main dans le config.yml du serveur pour les modifier).
magasins:
  # Region WorldGuard du spawn : magasins (et maisons de KS_Teleport) ; drapeaux build allow et scs-claim allow.
  region: zone_spawn
  # 1.9.0 : creation a 450 points, ou 5 blocs d'emeraude compresses tier 1 (meme valeur).
  prix-creation: 450
  blocs-tier1-creation: 5
  # Boutiques d'un magasin a sa creation (tier 1).
  boutiques: 10
  # 1.9.0 : boutiques ajoutees par chaque agrandissement (autant d'agrandissements que de nombres : tier 4 = 20
  # boutiques). Le x-ieme agrandissement coute 10x^2 + 450x - 50 points (410, 890, 1390) : formule ecrite dans le code.
  boutiques-par-agrandissement: [2, 3, 5]
  # Heures pendant lesquelles la place d'une boutique supprimee reste prise (0 : aucune attente).
  delai-suppression-heures: 3

# 1.3.0 - rachats de la semaine (a ajouter a la main dans le config.yml du serveur pour les modifier).
rachats:
  # 1.4.0 : objets tires chaque semaine (une famille au hasard, puis un de ses objets ; plus de gamme de prix).
  objets: 10
  # Ecart maximal du prix de la semaine autour du prix du bareme, en %.
  variation-pourcent: 25
  quota:
    # 1.8.2 : au-dessus de ce total de points gagnes en vendant au serveur (rachats de la semaine, marchand ambulant ;
    # compteur qui ne baisse jamais), un objet ne rapporte par jour qu'une part de ces gains, en %.
    seuil: 2500
    pourcent: 0.5
    # Part quand le joueur masque son solde.
    pourcent-masque: 0.75

# 1.7.0 - rachats du marchand ambulant (a ajouter a la main dans le config.yml du serveur pour les modifier).
marchand:
  # Objets tires pour chaque marchand (memes regles que les rachats de la semaine).
  objets: 10
  # Nombre de fois qu'un rachat sert, pour tous les joueurs ensemble, selon le prix a l'unite :
  # moins de 0,1 ; 0,1 a 1 ; 1 a 10 ; 10 a 100 ; 100 et plus.
  echanges: [10, 10, 5, 2, 1]

# 1.13.0 - evenement (admin shop, /adminshop ouvrir <jours>) ; a ajouter a la main dans le config.yml du serveur pour
# les modifier. Objets et prix de l'admin shop : adminshop.yml.
evenement:
  # Objets des rachats de la semaine pendant l'evenement (rachats.objets en temps normal).
  rachats-objets: 100
  # Heures avant la fin ou tous les joueurs sont prevenus de la fermeture.
  annonce-veille-heures: 24
