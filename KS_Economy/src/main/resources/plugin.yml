name: KS_Economy
version: '${project.version}'
main: fr.kalium.economy.KSEconomy
api-version: '26.2'
description: Economie du serveur Event (score en emeraudes dematerialisees, blocs compresses, /echange, economie Vault, rachats de la semaine).
authors: [KaLium]
depend: [KLM_Menu]
softdepend: [KS_Menu, Vault, WorldGuard, SimpleClaimSystem, KS_Dimensions]
commands:
  economie:
    description: Ouvre le menu Economie (solde, depot, retrait).
    aliases: [eco]
    usage: /economie
  echange:
    description: Echange d'objets et de points avec un joueur proche.
    usage: /echange <joueur> | accepter [joueur] | refuser [joueur]
  accepter:
    description: Accepte une demande d'echange (un menu s'ouvre s'il y en a plusieurs).
    usage: /accepter [joueur]
  rachat:
    description: Rachats de la semaine (10 objets rachetes par le serveur).
    aliases: [rachats]
    usage: /rachat
  magasin:
    description: Ton magasin (creer, agrandir, position).
    usage: /magasin [create | agrandir | position | signalements]
  magasins:
    description: Catalogue des magasins des autres joueurs (et les rachats de la semaine).
    aliases: [shop, market]
    usage: /magasins
permissions:
  kseconomy.staff:
    description: Recevoir et traiter les signalements de boutiques et de magasins (/magasin signalements).
    default: op
