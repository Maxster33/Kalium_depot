name: KS_Economy
version: '${project.version}'
main: fr.kalium.economy.KSEconomy
api-version: '26.2'
description: Economie du serveur Event (score en emeraudes dematerialisees, blocs compresses, /echange, economie Vault, rachats de la semaine).
authors: [KaLium]
depend: [KLM_Menu]
softdepend: [KS_Menu, Vault, WorldGuard, SimpleClaimSystem]
commands:
  economie:
    description: Ouvre le menu Economie (solde, depot, retrait).
    aliases: [eco]
    usage: /economie
  echange:
    description: Echange d'objets et de points avec un joueur proche.
    usage: /echange <joueur> | accepter | refuser
  rachat:
    description: Rachats de la semaine (10 objets rachetes par le serveur).
    aliases: [rachats]
    usage: /rachat
  magasin:
    description: Ton magasin (creer, agrandir, position).
    usage: /magasin [create | agrandir | position | signalements]
permissions:
  kseconomy.staff:
    description: Recevoir et traiter les signalements de boutiques et de magasins (/magasin signalements).
    default: op
