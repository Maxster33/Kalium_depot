# Distance entre deux wagons d'un train, de centre a centre (blocs). 1.3.0 : 1,4 (a 1,1 les wagons detaches se
# poussaient). La locomotive se pose sur round(2 x espacement) + 1 rails droits (4 a 1,4).
espacement: 1.4
# Vitesse maximale d'un train dont la traction suffit (bloc par tick ; 1 = 20 blocs par seconde).
# Avec l'ancienne physique du jeu, un wagonnet a four ne depasse pas 0,2 bloc par tick.
vitesse-max: 1.0
# Vitesse maximale perdue par wagon au-dela de la traction (bloc par tick).
perte-par-wagon: 0.1
# Vitesse gagnee et perdue a chaque tick au demarrage et au freinage (bloc par tick). 1.3.1 : 0,005 (100 blocs pour
# aller de l'arret a 1 bloc/tick) et 0,01 (50 blocs pour s'arreter) ; multipliees par traction / wagons en surcharge.
acceleration: 0.005
freinage: 0.01
# 1.1.0 : vitesse d'un niveau (1 a 4) du wagon controleur et du menu (bloc par tick ; 0,25 = 5 blocs par seconde).
# Plafonnee par vitesse-max.
palier: 0.25
# 1.1.0 : vitesse maximale en marche arriere (bloc par tick ; 0,05 = 1 bloc par seconde).
marche-arriere-max: 0.05
# 1.1.0 : carburant brule par bloc parcouru selon le niveau (niveau 2 = croisiere = 1 charbon pour 80 blocs).
# Marche arriere et freinage jusqu'a l'arret : comme le niveau 1.
consommation:
  niveau-1: 0.75
  niveau-2: 1.0
  niveau-3: 1.25
  niveau-4: 1.5
# 1.3.0 : chargement des wagons affiche plus gros pour les joueurs Java (four, coffre, entonnoir, jukebox).
# taille : cote du bloc (le chargement du jeu fait 0,75 ; 1.3.8 : 0,875, a 1,0 il depassait du wagonnet) ;
# hauteur : decalage vertical du bloc dans le wagon.
decor:
  # 1.4.0 : false = pas de modele agrandi (serveur allege).
  actif: true
  taille: 0.875
  hauteur: -0.1
# 1.3.0 : wagon jukebox. Volume de la musique (4 = entendue a 64 blocs, comme un jukebox).
jukebox:
  volume: 4.0
# 1.3.2 : vitesse perdue dans les virages (0,25 = -25 %), sauf au niveau 1 ; le train freine avant d'y arriver.
virage:
  reduction: 0.25
# 1.3.3 : vitesse perdue par le train a chaque percussion (0,10 = -10 %), sans descendre sous le niveau 1 (palier).
percussion:
  ralentissement: 0.10
  # 1.4.1 : montee donnee a une entite percutee a pleine vitesse (bloc/tick ; 3,0 = 40 blocs de haut, 2,0 = 20 blocs,
  # 1,5 = 12 blocs), et poussee horizontale maximale (bloc/tick).
  hauteur: 3.0
  horizontal: 3.0
# 1.3.5 : vitesse perdue a chaque rail propulseur eteint franchi (0,05 bloc/tick = 1 bloc/s ; 20 rails arretent un
# train a 20 blocs/s). Sur un rail propulseur allume, le train ne consomme pas de carburant.
propulseur:
  freinage: 0.05
# 1.4.0 : nombre maximal de wagons par train.
wagons-max: 64
# 1.4.3 : surcharge. Au-dela de `seuil` wagons, chaque four consomme 1 + taux x (wagons - seuil) / fours alimentes
# (locomotive seule a 15 wagons : x1,27 ; 64 wagons et 8 fours : x1,71).
surcharge:
  seuil: 7
  taux: 0.10
