# KS_AntiCheat - valeurs par defaut aussi dans le code.

# Morts d'entites importantes (journal plugins/KS_AntiCheat/morts.log) : types d'entites, mobs nommes, animaux apprivoises.
morts:
  types: [VILLAGER, IRON_GOLEM, SNOW_GOLEM, COPPER_GOLEM, ALLAY, WITHER, ENDER_DRAGON, ELDER_GUARDIAN, WARDEN]
  nommes: true
  apprivoises: true

# GrimAC : alerte legere quand une meme verification signale un joueur N fois en 10 minutes ; suspension automatique
# si une verification « lourde » (debut du nom) atteint ce niveau de violation.
grimac:
  alerte-signalements: 10
  seuil-suspension: 100
  lourdes: [Reach, Hitboxes, FastBreak, FarBreak, MultiBreak, Timer]
  # Ecart minimal (premier nombre du detail de GrimAC) pour compter un signalement de cette verification.
  ecart-minimum:
    Simulation: 0.05

# X-ray : filons rares caches par heure, et taux pour 1 000 blocs de roche mines. Suspension : N heures extremes sur
# les X dernieres heures (pas sur une seule heure chanceuse).
xray:
  alerte-filons: 5
  alerte-taux: 3
  extreme-filons: 10
  extreme-taux: 8
  extreme-heures: 3
  fenetre-heures: 6

# Macros : alerte si N actions sont faites sans bouger ni tourner la camera depuis X minutes.
macros:
  minutes: 5
  actions: 20

# AFK : expulsion apres X minutes sans vrai mouvement ni mouvement de camera (permission ksanticheat.afk-libre : jamais).
afk:
  minutes: 60

# Revente suspecte (alertes legeres) : objets de valeur (types ; aussi tous les objets custom de nos plugins),
# contrepartie minimale en points, fenetre apres une recompense, dons en 7 jours, dons au meme joueur en 7 jours,
# jours d'attente d'une recompense non recuperee.
revente:
  objets: [NETHERITE_INGOT, NETHERITE_BLOCK, NETHERITE_SCRAP, ANCIENT_DEBRIS, NETHERITE_SWORD, NETHERITE_PICKAXE, NETHERITE_AXE, NETHERITE_SHOVEL, NETHERITE_HOE, NETHERITE_HELMET, NETHERITE_CHESTPLATE, NETHERITE_LEGGINGS, NETHERITE_BOOTS, ELYTRA, NETHER_STAR, BEACON, TOTEM_OF_UNDYING, ENCHANTED_GOLDEN_APPLE, HEAVY_CORE, MACE, DRAGON_EGG, DIAMOND_BLOCK, EMERALD_BLOCK, SPAWNER, TRIDENT]
  points-contrepartie: 1000
  minutes-recompense: 30
  dons: 5
  sens-unique: 3
  jours-attente: 14
  # Tetes de mobs (KS_Decapitator) qui comptent comme objets de valeur (id ou debut d'id ; bebes compris).
  tetes-rares: [axolotl.blue, panda.brown, sheep.pink, mooshroom.brown, rabbit.toast, sheep.jeb, creeper.charged, goat.screaming, skeleton_horse, zombie_horse, wither, elder_guardian, warden]

# Bannir de KaLium (LibertyBans sur le proxy, par KaliumRelay 1.4.0). Le jeton n'est JAMAIS dans le depot : a remplir
# sur le serveur (meme valeur que le proxy).
relay-url: "http://7018.mystrator.com:46199"
relay-token: ""

# Regle vanilla tntExplosionDropDecay activee dans les mondes d'Event (fermes a TNT moins efficaces).
tnt-drop-decay: true
