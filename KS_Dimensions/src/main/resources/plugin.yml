name: KS_Dimensions
version: '${project.version}'
main: fr.kalium.dimensions.KSDimensions
api-version: '26.2'
description: Serveur Event - menu des operateurs pour activer / desactiver les portails du Nether et de l'End.
authors: [KaLium]
depend: [KLM_Menu]

commands:
  dimensions:
    description: Ouvre le menu des portails du Nether et de l'End (operateurs).
    usage: /<command>
    permission: ksdimensions.admin

permissions:
  ksdimensions.admin:
    description: Ouvrir le menu /dimensions et activer / desactiver les portails.
    default: op
