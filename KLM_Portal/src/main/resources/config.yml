# ============================================================
#  KLM_Portal - portails du reseau KaLium
#  Le meme fichier .jar peut etre installe sur n'importe quel serveur Paper (avec KLM_Menu et WorldGuard).
# ============================================================
#
# Un portail = une region WorldGuard + une destination de KLM_Menu.
#  - La region se dessine avec la baguette de WorldEdit, puis : /rg define <nom de la region>
#  - Le portail se cree en jeu, dans le monde de la region : /klmportal set <nom de la region> <destination>
#  - destination = identifiant d'un bouton de KLM_Menu sur CE serveur : cle de "servers" (nom du serveur dans
#    velocity.toml, ex. kal-games, Kanvas), nom du lobby, ou cle de "local-entries" (commande locale).
#    Un nom de serveur absent du menu marche aussi, mais ne peut alors pas etre desactive.
#
# Quand le bouton de la destination est desactive dans KLM_Menu (menu > Parametres), le portail l'est aussi :
# le joueur recoit un message et est repousse hors de la region.
#
# Exemple :
# portals:
#   portail-kalgames:
#     world: world
#     destination: kal-games
portals: {}

# Force du recul quand le portail est desactive (0.1 a 3).
push-strength: 0.8

# Delai (en secondes) avant qu'un meme joueur puisse reprendre un portail (evite les envois en double).
cooldown-seconds: 3

# ============================================================
#  Points de chute (1.1.0) - se reglent en jeu : boussole > Interfaces > KLM_Portal > Points de chute
#  (ou /klmportal chute ... et /klmportal arrivee ...).
# ============================================================

# KaliumRelay (proxy) : transmet le point de chute au serveur d'arrivee. Le jeton est le "token" de
# relay.properties du proxy ; il ne s'ecrit QUE dans le config.yml du serveur (jamais dans le depot).
# Vide = aucun point de chute transmis (seule "default-arrival" s'applique).
relay-url: "http://7018.mystrator.com:46199"
relay-token: ""

# Nom de CE serveur dans velocity.toml (ex. lobby). Sert a ignorer une consigne destinee a un autre serveur.
# Vide = pas de verification.
server-name: ""

# Point de chute des joueurs envoyes d'ICI vers chaque serveur (cle = nom du serveur dans velocity.toml).
#  mode: derniere-position | coordonnees (x, y, z, yaw, pitch, world ; world vide = monde principal de l'arrivee)
# Sans entree : le serveur d'arrivee applique sa "default-arrival".
# Exemple :
# landings:
#   lobby:
#     mode: coordonnees
#     world: ""
#     x: 0.5
#     y: 65.0
#     z: 0.5
#     yaw: 0.0
#     pitch: 0.0
landings: {}

# Arrivee sur CE serveur quand aucune consigne n'est transmise (connexion directe au reseau, serveur de depart
# sans KLM_Portal, destination sans point de chute). mode: derniere-position | coordonnees (+ x, y, z...).
default-arrival:
  mode: derniere-position

# ============================================================
#  Effets de zone (1.2.0) : tant qu'un joueur est dans la region WorldGuard, il a ces effets (duree infinie,
#  sans particules) ; ils lui sont retires en sortant. Niveau = meme valeur que /effect give (0 = niveau I).
#  Noms des effets : ceux de Minecraft (speed, jump_boost, night_vision, ...). Applique avec /klmportal reload.
# ============================================================
# Exemple :
# region-effects:
#   lobby:
#     world: Lobby Kalium
#     effects:
#       speed: 6
#       jump_boost: 2
region-effects: {}
