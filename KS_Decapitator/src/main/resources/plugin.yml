name: KS_Decapitator
version: '${project.version}'
main: fr.kalium.decapitator.KSDecapitator
api-version: '26.2'
description: Tetes de mobs du serveur Event (1 % quand un joueur tue le mob, une tete par variante, etat et bebe).
authors: [KaLium]
commands:
  tetes:
    description: Tes tetes de mobs deja obtenues (operateurs - toutes les tetes, clic pour en prendre une).
    usage: /tetes
permissions:
  ks.decapitator.tetes:
    description: Voir toutes les tetes dans /tetes et en prendre une d'un clic.
    default: op
