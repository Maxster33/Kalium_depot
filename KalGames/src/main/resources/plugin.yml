name: KalGames
version: '${project.version}'
main: fr.kalium.games.KalGames
api-version: '26.2'
# 1.14.0 : classements (points, temps, archives, panneaux) dans le plugin KG_ScoreBoards.
depend: [KG_ScoreBoards, KLM_Menu, KG_Menu]
# 1.16.0 : menus du hub dans KG_Menu (menu du serveur kal-games), boussole geree par KLM_Menu.
description: Hub, menus et parties instanciees (PvP Kit, parcours, course de bateau...) pour Kal-Games.
authors: [KaLium]
softdepend: [PlayerKits2]

commands:
  kalgames:
    description: Commandes KalGames (hub, jeux, administration).
    aliases: [kg]
    usage: /<command> <hub|jeux|rejoindre|quitter|admin|reload>
  hub:
    description: Retourne au hub de Kal-Games.
    usage: /<command>

permissions:
  kalgames.admin:
    description: Menu Parametres (mini-jeux, arenes, kits, instances) et rechargement.
    default: op
  kalgames.bypass:
    description: Ignore la protection du hub (construire, casser, deplacer les objets).
    default: op
