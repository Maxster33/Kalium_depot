# ============================================================
#  KalGames - configuration
#  Les textes se modifient dans lang.yml (format MiniMessage).
#  Les mini-jeux, arenes et kits se gerent depuis le menu
#  "Parametres" (objet Mini-jeux du hub, visible des moderateurs).
# ============================================================

hub:
  # Monde du hub de Kal-Games.
  world: Kal-Games
  # true = point d'apparition du monde (point de respawn actuel). Definissez un point precis
  # depuis Parametres > Hub de Kal-Games > "Definir le hub ici" (passe use-world-spawn a false).
  use-world-spawn: true
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
  # Envoie les joueurs au hub a chaque connexion et vide leur inventaire (objets verrouilles uniquement).
  teleport-on-join: true
  # Protege le hub : pas de casse/pose de blocs, pas de degats, pas de faim (permission kalgames.bypass pour construire).
  protect: true
  gamemode: ADVENTURE

# Nom du lobby declare dans le velocity.toml (bouton "Retour au lobby").
lobby-server: lobby

# Mini-jeu Bingo (serveur separe, voir KalBingo). Cree/rejoint une partie et transfere les
# joueurs - la salle d'attente et le choix d'equipe vivent sur le serveur Bingo lui-meme
# (demande explicite de l'utilisateur), pas ici.
bingo:
  # Nom du serveur Bingo declare dans le velocity.toml - a modifier facilement selon
  # l'environnement (Kixster pour les tests actuellement, demande explicite de l'utilisateur).
  server-name: kixster
  # Duree d'une partie, en secondes - sert UNIQUEMENT de repli pour la commande texte /bingo create
  # (pas de formulaire possible en commande, voir BingoCommand - placeholder de test). Le menu du
  # hub, lui, utilise max-duration-minutes ci-dessous comme valeur pre-remplie (l'hote peut la
  # reduire, voir PlayerMenus.openBingoCreate) - garde ce reglage-ci pour ne pas casser /bingo create.
  duration-seconds: 3600
  # AJOUTE le 23/09/2026 : duree MAXIMALE (en minutes) qu'une partie peut avoir, modifiable par un
  # OPERATEUR via Paramètres > Bingo (menu admin, voir AdminMenus.openBingoSettings) - demande
  # explicite de l'utilisateur : "le temps par defaut maximum doit être 1h, cette limite doit
  # pouvoir etre changee via les parametres de kalgames. le createur de la partie doit pouvoir
  # réduire le temps mais ne doit pas pouvoir dépasser le temps maximum défini par les opérateurs."
  # Le formulaire de creation (menu "Bingo" du hub) est donc pre-rempli avec CETTE valeur et permet
  # de la reduire jusqu'a min-duration-minutes, jamais de la depasser.
  max-duration-minutes: 60
  # Plancher technique (minutes) - pas expose dans le menu admin (non demande), evite juste une
  # partie degenerement courte (grille impossible a terminer).
  min-duration-minutes: 5
  # PLUS UTILISE depuis le 24/09/2026 (corrige un bug : une partie 2 equipes x 1 joueur affichait
  # "2/16" et pouvait accepter jusqu'a 16 joueurs au lieu de 2). La capacite reelle d'une partie
  # est desormais TOUJOURS teamCount x teamSize, choisis par l'hote a la creation - voir
  # BingoParty.maxPlayers(). Cle laissee ici sans effet pour eviter de casser un config.yml deja
  # deploye ; peut etre supprimee sans risque lors d'un prochain nettoyage.
  max-party-size: 16
  # Bornes du nombre d'equipes / joueurs par equipe proposees a l'hote lors de la creation
  # (menu "Bingo" du hub) - doivent rester cohérentes avec KalBingo (teams.max-teams /
  # teams.max-team-size, 4x4 par defaut - confirme par l'utilisateur : "jusqu'a 4 equipes,
  # 1 a 4 joueurs par equipe").
  max-team-count: 4
  max-team-size: 4
  # Valeurs utilisees par la commande texte /bingo create (pas de formulaire possible en
  # commande) - le menu du hub, lui, laisse l'hote choisir a chaque creation.
  default-team-count: 2
  default-team-size: 4
  # Relais HTTP (plugin Velocity KaliumRelay, sur le proxy) : des qu'un joueur est transfere vers
  # Bingo, sa partie y est deposee directement par ce biais plutot que par le canal BungeeCord
  # (Forward), qui a besoin d'un joueur connecte sur le serveur CIBLE pour livrer un message -
  # limite du protocole Minecraft lui-meme, responsable du bug ou un second joueur qui rejoignait
  # restait bloque puis etait expulse quand kal-games se retrouvait sans aucun joueur en ligne.
  # relay-url vide = fonctionnalite desactivee (retour silencieux, aucune casse).
  relay-url: "http://7018.mystrator.com:46199"
  # Jeton du relais : a renseigner UNIQUEMENT dans le config.yml du serveur, jamais ici (depot public,
  # voir REGLES.md section 2). Meme valeur que "token" dans relay.properties du proxy. Vide = le relais
  # refuse les requetes et seul le canal BungeeCord est utilise.
  relay-token: ""

gui:
  button-width: 240

# Objets verrouilles (emplacement de la hotbar 0-8 et matiere).
items:
  games:
    slot: 4
    material: NETHER_STAR
  game-menu:
    slot: 4
    material: NETHER_STAR
  checkpoint:
    slot: 0
    material: LIME_DYE

# Monde des instances : toutes les parties y sont collees a des emplacements distincts.
instances:
  # Taille d'un emplacement (blocs). Elle est automatiquement portee a arenas.max-size + min-distance si besoin.
  spacing: 1536
  # Distance minimale (blocs) entre deux parties : une arene ne peut jamais etre a moins de 1000 blocs d'une autre.
  min-distance: 1000
  # Chaque arene a sa propre zone (rangee) dans le monde des instances : deux arenes differentes ne se
  # superposent jamais. per-arena = nombre maximal de parties simultanees d'une meme arene.
  per-arena: 10
  base: 262144
  # Nombre maximum de parties simultanees.
  max: 40
  # A la fin de chaque partie les joueurs sont renvoyes au hub.
  close-after-match: true
  # L'arene de la partie terminee n'est pas supprimee : elle est remise en etat et gardee de cote pour la partie
  # suivante (pas de rechargement, donc pas de lag).
  keep-arena-after-match: true
  # Nombre de copies libres gardees de cote pour chaque arene (les mini-jeux qui pre-generent des copies en gardent au
  # moins autant, voir "Copies de chaque arene prechargees" dans les parametres du mini-jeu).
  keep-idle-per-arena: 2
  # Une copie est regeneree apres ce nombre de parties (securite : blocs modifies que le suivi n'aurait pas restaures).
  recycle-after: 25
  # Blocs colles par tick au lancement d'une partie (plus haut = demarrage plus rapide mais plus de charge).
  paste-blocks-per-tick: 40000
  # Blocs effaces par tick quand une ancienne copie d'arene est supprimee (recapture, suppression). Les copies sont
  # effacees une par une. Par defaut : la moitie de paste-blocks-per-tick.
  wipe-blocks-per-tick: 20000

# Limites de taille des arenes (capture de la zone).
arenas:
  # Taille maximale d'une arene sur chaque cote horizontal (blocs). Maximum technique : 8191.
  max-size: 1500
  # Volume maximal de la zone capturee (largeur x hauteur x longueur).
  max-volume: 500000000
  # Nombre maximal de blocs non vides dans une arene (memoire : 8 octets par bloc, en jeu comme a la capture).
  max-blocks: 60000000
  # Blocs analyses par tick pendant la capture (plus bas = capture plus lente mais moins de charge). Les chunks sont
  # charges en arriere-plan, sans jamais bloquer le serveur.
  capture-blocks-per-tick: 30000

kits:
  # Dossier des kits PlayerKits2 (relatif au dossier plugins/).
  playerkits2-folder: PlayerKits2/kits

# Classement general : commandes executees par la console (datapack "minigames").
# Placeholders : %player%, %points%, %obj%, %minigame%
scoring:
  objective-format: "%minigame%_victoires"
  bridge:
    enabled: true
    win-commands:
      - 'scoreboard players set #amount mg_g %points%'
      - 'execute as %player% run function minigames:score/add {obj:"%obj%"}'
    combat-leave-commands:
      - 'function minigames:sanction/combat_leave {name:"%player%",obj:"%obj%"}'

# Classements (points cumules et meilleurs temps) : general depuis la creation du serveur + classement du mois.
# A chaque changement de mois le classement complet est archive (dossier archives/) puis remis a zero.
stats:
  # Fuseau horaire du changement de mois (ex. Europe/Paris, Pacific/Noumea). Vide = fuseau du serveur.
  timezone: ''
  # Les parties privees comptent pour les classements et le datapack.
  count-private-games: true
  # Parties privees : nombre maximum de parties par jour, par joueur et par jeu, dont les points comptent
  # pour les classements (0 = pas de limite). Le jour change a minuit dans le fuseau ci-dessus.
  private-daily-limit: 5
  # Les points et temps des operateurs (OP) ne comptent pas pour les classements.
  exclude-operators: true

# Panneaux de classement du hub (places depuis Parametres > Mini-jeux > Classements).
boards:
  # Taille du texte.
  scale: 1.3
