# KV_Plots - reglages (cahier des charges : KV_Plots/CAHIER_DES_CHARGES.md)

# Monde des plots (ex « New World (2) », renomme « kanvas »).
monde: kanvas

grille:
  # Coin nord-ouest (x et z les plus petits) de l'interieur constructible du plot (0, 0), bordure non comprise.
  # Le plot (0, 0) sert aussi de centre pour la reservation automatique.
  origine-x: -107
  origine-z: -57
  # Interieur constructible d'un plot moyen (sans la bordure en bedrock).
  taille-plot: 49
  # Largeur d'une route, bordures en bedrock des deux plots comprises.
  largeur-route: 9
  # Plots deja construits dans le monde : numeros de colonne (vers l'est, +x) et de ligne (vers le sud, +z) de la
  # grille, bornes comprises. Le plot (0, 0) est celui de l'origine.
  colonne-min: -5
  colonne-max: 5
  ligne-min: -5
  ligne-max: 5

limites:
  # Places au depart (le 2e moyen et le 2e grand se debloqueront a 100 points, plus tard).
  moyens: 1
  grands: 1

# Travaux sur le terrain (fusion des 4 plots d'un grand plot) : blocs modifies au plus par tick.
blocs-par-tick: 20000
