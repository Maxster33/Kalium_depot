name: KV_Plots
version: '${project.version}'
main: fr.kalium.kvplots.KVPlots
api-version: '26.2'
description: Serveur Kanvas - plots de construction en creatif (reservation, editeurs, protection WorldGuard).
authors: [KaLium]
depend: [WorldGuard]

commands:
  plot:
    description: Reserver et gerer ses plots.
    usage: /<command> reserver|tp|liste|info|editeur
    permission: kvplots.joueur
  kvadmin:
    description: Administration des plots de Kanvas (generation de la grille).
    usage: /<command> generer [confirmer]
    permission: kvplots.admin

permissions:
  kvplots.joueur:
    description: Reserver des plots, s'y teleporter, gerer ses editeurs.
    default: true
  kvplots.admin:
    description: Generer la grille de plots.
    default: op
